<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회전일 차트</title>
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="only light"><!-- 삼성 브라우저 등의 강제 다크모드로 색이 바뀌지 않게 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="회전일 차트">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* ===== 블루 포커스 디자인 (2026-11) ===== */
:root{
  --bg:#fff; --soft:#F4F6FA; --card:#fff; --ink:#191F28; --sub:#4E5968; --mute:#8B95A1; --line:#EEF0F4;
  --blue:#1E5EF3; --blue2:#3D7BFF; --blue-bg:#EAF1FF;
  --brand:#1E5EF3; --brand2:#1E5EF3;
  --red:#D92D20; --red-bg:#FEECEB; --org:#C4610A; --org-bg:#FFF1E0;
  --grn:#16A34A; --grn-bg:#E7F6EC; --gry:#6B7684; --gry-bg:#F2F4F6; --ylw-bg:#FFF8DB; --chip:#F2F4F6;
}
*{box-sizing:border-box}
:root{color-scheme:only light}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%} /* 브라우저 글자 크기 자동 확대로 칸이 깨지지 않게 */
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.45;letter-spacing:-.01em;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:middle}
.wrap{max-width:860px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
/* 헤더 */
header.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
header.top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:0 4px}
header.top h1{font-size:18px;font-weight:800;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .who{font-size:13px;color:var(--mute);white-space:nowrap}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--sub);border:0;cursor:pointer;flex:0 0 auto;font-weight:800;font-size:14px}
.ib.plain{background:none}.ib.av{background:var(--blue-bg);color:var(--blue)}
.back{background:none;border:0;color:var(--ink);padding:4px 2px 4px 0;cursor:pointer;display:grid;place-items:center}
.back svg.ic{width:24px;height:24px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;font-weight:700;vertical-align:middle}
.b-admin{background:#FFE8A3;color:#5C4500}
/* 버튼 */
.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:var(--blue-bg);color:var(--blue);border:0}
.btn.ghost{background:var(--chip);color:var(--sub);padding:7px 11px;font-size:13px}
.btn.danger{background:var(--red-bg);color:var(--red);border:0}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px;font-weight:600}
/* 아이폰 사파리: 입력칸 글자가 16px보다 작으면 누를 때 화면을 자동 확대함 → 16px로 고정 */
input,select,textarea{font-size:16px}
input.i,select.i,textarea.i{font-size:16px;width:100%;max-width:100%;min-width:0;padding:12px 13px;border:1px solid #E1E5EB;border-radius:12px;background:#fff}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,94,243,.12)}
/* 일자·금액 두 칸: 넓은 화면은 나란히, 휴대폰은 위아래 (아이폰 날짜 칸 겹침 방지) */
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair>div{min-width:0}
@media (max-width:560px){.pair{grid-template-columns:minmax(0,1fr);gap:0}}
/* 아이폰 Safari: 날짜 칸이 옆 칸을 덮지 않게 */
input.i[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:48px;text-align:left}
input.i[type=date]::-webkit-date-and-time-value{text-align:left}
textarea.i{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:16px}
.muted{color:var(--mute);font-size:13px}
.err{color:var(--red);font-size:14px;margin-top:8px;white-space:pre-wrap}
.ok{color:var(--grn);font-size:14px;margin-top:8px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
.c-block{background:var(--red-bg);color:var(--red)} .c-soon{background:var(--org-bg);color:var(--org)}
.c-ok{background:var(--blue-bg);color:var(--blue)} .c-none{background:var(--gry-bg);color:var(--gry)} .c-hold{background:#F1E9FB;color:#6A3FA0}
.c-warn{background:var(--ylw-bg);color:#7A5A00}
/* 첫 화면: 파란 요약 카드 */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 16px;color:#fff;background:linear-gradient(135deg,#1E5EF3,#3D7BFF);margin-top:4px}
.hero:after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .k{font-size:15px;font-weight:700;opacity:.95}
.hero .v{font-size:34px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}.hero .v small{font-size:20px;margin-left:2px}
.hero .d{font-size:13px;opacity:.88}
.hero .mini{display:flex;gap:6px;margin-top:14px}
.hero .mini>div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px;min-width:0}
.hero .mini .l{font-size:11.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero .mini .n{font-size:15px;font-weight:800;margin-top:1px;white-space:nowrap}
.hero .tag{display:inline-block;background:#fff;font-size:12.5px;font-weight:800;padding:4px 9px;border-radius:8px}
.hero .tag.block{color:var(--red)}.hero .tag.soon{color:var(--org)}.hero .tag.ok{color:var(--blue)}.hero .tag.hold{color:#6A3FA0}.hero .tag.none{color:var(--gry)}
.hero .two{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:6px}
.chips{display:flex;gap:6px;margin:12px 0 2px;flex-wrap:nowrap}
.chips .chipsel{flex:1 1 0;min-width:0}.chips .chipsel select,.chips .chipsel input{flex:1;width:100%;max-width:none}
.chipsel{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border:0;border-radius:10px;padding:0 10px;height:38px;font-size:14px;font-weight:600;color:var(--sub);max-width:100%}
.chipsel select,.chipsel input{border:0;background:transparent;font-size:16px;font-weight:600;color:var(--sub);padding:0;min-width:0;max-width:190px;-webkit-appearance:none;appearance:none;height:36px}
.chipsel input[type=date]{max-width:150px;min-height:0;display:block}
h2.sh{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;margin:22px 2px 12px}
h2.sh .sp{flex:1}h2.sh .s{font-size:13px;color:var(--mute);font-weight:600}
/* 회전일 분포 (4칸 × 2줄) */
.dist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 4px}
.dist .bk{display:block;width:100%;text-align:center;background:none;border:0;border-radius:12px;padding:6px 0 8px;cursor:pointer;min-width:0}
.dist .bk .bar{height:7px;border-radius:4px;width:56%;margin:0 auto 9px}
.dist .bk .k{font-size:13px;color:var(--sub);font-weight:600;white-space:nowrap}
.dist .bk .v{font-size:23px;font-weight:800;margin-top:2px;white-space:nowrap}.dist .bk .v small{font-size:15px;font-weight:700}
.dist .bk.amt .v{font-size:14.5px;margin-top:3px}
.dist .bk:disabled,.dist .bk.zero{cursor:default}.dist .bk:disabled .k,.dist .bk:disabled .v,.dist .bk.zero .k,.dist .bk.zero .v{color:#C2C8D0}
.dist .bk.sel{background:var(--blue-bg)}
.cta{display:flex;width:100%;align-items:center;justify-content:space-between;border:0;border-radius:12px;padding:13px 14px;margin-top:10px;font-size:15px;font-weight:700;cursor:pointer;text-align:left}
.cta.r{background:var(--red-bg);color:var(--red)}.cta.o{background:var(--org-bg);color:var(--org)}.cta.on{outline:2px solid currentColor}
.filt{display:flex;align-items:center;gap:8px;background:var(--blue-bg);color:var(--blue);border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:700;margin:0 0 6px}
.filt .grow{min-width:0}.filt button{border:0;background:#fff;color:var(--blue);border-radius:8px;padding:5px 9px;font-weight:700;font-size:12.5px;cursor:pointer}
.sortbar{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:-2px -16px 6px;padding:0 16px}
.sortbar::-webkit-scrollbar{display:none}
.sortbar button{flex:0 0 auto;font-size:13px;font-weight:600;padding:7px 12px;border-radius:20px;background:var(--chip);color:var(--sub);border:0;cursor:pointer;white-space:nowrap}
.sortbar button.on{background:var(--ink);color:#fff}
.qbox{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:0 12px;margin-bottom:8px;color:var(--mute)}
.qbox input{flex:1;border:0;background:transparent;height:44px;font-size:16px;min-width:0;outline:none;color:var(--ink)}
/* 거래처 줄 */
.cust{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;cursor:pointer;color:inherit}
.cust .m{min-width:0;flex:1}
.cust .nm{display:block;font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust .a{font-size:16.5px;font-weight:700;white-space:nowrap}
.tags{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
.tag.block{background:var(--red-bg);color:var(--red)}.tag.soon{background:var(--org-bg);color:var(--org)}.tag.ok{background:var(--blue-bg);color:var(--blue)}
.tag.hold{background:#F1E9FB;color:#6A3FA0}.tag.none{background:var(--gry-bg);color:var(--gry)}.tag.warn{background:var(--ylw-bg);color:#7A5A00}
.cust .s{font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.5}
.cust .s .old{color:#B54708;font-weight:700}
/* 하단 바 */
.fab{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.fab>*{max-width:560px}
.fab .p{flex:1;height:54px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.fab .g{flex:0 0 auto;height:54px;min-width:62px;padding:0 12px;border:0;border-radius:14px;background:var(--blue-bg);color:var(--blue);font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
.fab .g svg.ic{width:21px;height:21px}
/* ⋯ 메뉴 */
.dim{position:fixed;inset:0;background:rgba(15,23,42,.25);z-index:40}
.menu{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top));width:236px;background:#fff;border-radius:16px;box-shadow:0 12px 36px rgba(16,24,40,.18);padding:8px;z-index:41}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:12px;border-radius:10px;font-size:15px;font-weight:600;border:0;background:none;cursor:pointer;text-align:left}
.menu button:active{background:var(--chip)}.menu .h{font-size:12.5px;color:var(--mute);padding:6px 12px 4px}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* 상세 */
.note{background:var(--red-bg);color:#B42318;border-radius:14px;padding:13px 14px;margin-top:12px;font-size:14.5px;line-height:1.5}.note b{font-weight:800}
.note.o{background:var(--org-bg);color:#9A4A06}
.kvl{display:flex;flex-direction:column;gap:11px;margin-top:14px;font-size:15px}
.kvl>div{display:flex;justify-content:space-between;align-items:center;gap:10px}.kvl>div>span:first-child{color:var(--mute);white-space:nowrap}.kvl b{font-weight:600;text-align:right}
.kvl select.i{width:auto;max-width:200px;padding:7px 10px;font-weight:600}
.ord{display:flex;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
.ord .m{flex:1;min-width:0}.ord .t1{font-size:15.5px;font-weight:700;word-break:keep-all;overflow-wrap:break-word}
.ord .tags .s{font-size:12.5px;color:var(--mute)}.ord .r{text-align:right;font-size:15.5px;font-weight:700;white-space:nowrap}
.ph{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14.5px;flex-wrap:wrap}
/* 거래 내역 */
.ent{border-bottom:1px solid var(--line);padding:12px 2px}
.ent:last-child{border-bottom:0}
.ent.pend{background:var(--ylw-bg);border-radius:10px;padding:12px 8px} .ent.bad{background:var(--red-bg);border-radius:10px;padding:12px 8px}
.ent .l1{display:flex;gap:10px;align-items:center}
.ent .ei{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:var(--chip);color:var(--sub)}
.ent .ei.p{background:var(--blue-bg);color:var(--blue)}
.ent .ei svg.ic{width:18px;height:18px}
.ent .mm{flex:1;min-width:0}
.ent .it{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ent .dt{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12.5px;white-space:nowrap}
.ent .kd{font-weight:600;font-size:12.5px;white-space:nowrap;color:var(--mute)}
.ent .amt{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ent .amt.s{color:var(--ink)} .ent .amt.p{color:var(--blue)}
.ent .l2{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--mute);flex-wrap:wrap;padding-left:46px}
.ent .l2 .sp{flex:1}
/* 표 (동료 관리 등) */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--mute);font-weight:600;font-size:12.5px;white-space:nowrap}
table.t td{white-space:nowrap} table.t td.it{white-space:normal;min-width:90px;word-break:keep-all}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t.team{width:100%} table.t.team td{white-space:normal;vertical-align:middle} table.t.team td.n{white-space:nowrap}
tr.pend td{background:var(--ylw-bg)} tr.bad td{background:var(--red-bg)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.more{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:8px 0;border:0;background:none;color:var(--mute);font-size:13.5px;font-weight:600;cursor:pointer}
.more::before,.more::after{content:"";flex:1;border-top:1px solid var(--line)}
.login{max-width:400px;margin:10vh auto 0;padding:0 16px}
.login h2{margin:0 0 4px;font-size:24px;font-weight:800}
.login .logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#1E5EF3,#3D7BFF);display:grid;place-items:center;color:#fff;margin-bottom:16px}
h3{font-size:16px;margin:0 0 10px;font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv div:nth-child(odd){color:var(--mute)}
/* 여러 줄 입력 */
.mrow{background:#fff;border:1px solid var(--line);border-left:5px solid #D5DBE3;border-radius:14px;padding:12px;margin:10px 0}
.mrow.ok{border-left-color:var(--grn)} .mrow.mis{border-left-color:var(--org);background:#FFFAF2} .mrow.err{border-left-color:var(--red);background:var(--red-bg)} .mrow.skip{opacity:.55} .mrow.zero{border-left-color:#9AA3AF} .mrow.zero .mst{color:var(--sub)}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mskip{display:flex;align-items:center;gap:6px;font-size:13px}
.mdel{border:0;background:none;font-size:18px;cursor:pointer;padding:2px 4px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}
.mgrid label{font-size:12.5px;color:var(--sub);display:block;min-width:0}
.mgrid label .i{margin-top:3px;padding:10px}
.mgrid .span2{grid-column:1/-1}
.mst{font-size:13px;margin-top:6px;color:var(--sub)} .mrow.mis .mst{color:var(--org);font-weight:600} .mrow.err .mst{color:var(--red);font-weight:600} .mrow.ok .mst{color:var(--grn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#191F28;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1 1 auto;border:0;background:transparent;padding:9px 6px;cursor:pointer;white-space:nowrap;border-radius:9px;font-weight:600;color:var(--sub)}
.seg button.on{background:#fff;color:var(--blue);font-weight:800;box-shadow:0 1px 3px rgba(16,24,40,.12)}
/* 좁은 화면(아이폰 SE 등): 요약 칸 글자 줄바꿈 */
@media (max-width:370px){ .hero .mini .opt{display:none} .hero .mini>div{padding:8px} .hero .mini .l{font-size:11px} .hero .v{font-size:30px} .dist .bk .v{font-size:21px} }
/* 넓은 화면(PC): 거래처 목록 2열 */
@media (min-width:900px){ .clist{display:grid;grid-template-columns:1fr 1fr;column-gap:28px} }
</style>
</head>

// 로그인 편의 설정 (이 기기에만 저장)
const PREF = {
  get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set(k,v){ try{ v==null? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(_){} }
};
const autoLogin = ()=> PREF.get('cso_auto') === '1';   // 기본: 자동 로그인 꺼짐 (체크했을 때만 유지)
const saveIdOn = ()=> PREF.get('cso_saveid') !== '0';   // 기본: 아이디 저장 켜짐
// 자동 로그인 켜짐 → 로그인 유지(localStorage) / 꺼짐 → 브라우저를 닫으면 로그아웃(sessionStorage)
const authStorage = {
  getItem(k){ try{ return (autoLogin()?localStorage:sessionStorage).getItem(k); }catch(_){ return null; } },
  setItem(k,v){ try{ (autoLogin()?localStorage:sessionStorage).setItem(k,v); (autoLogin()?sessionStorage:localStorage).removeItem(k); }catch(_){} },
  removeItem(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(_){} }
};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'receivables' }, auth: { storage: authStorage, persistSession: true } });

// ===== 유틸 =====
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function won(n){ return (Number(n)||0).toLocaleString('ko-KR'); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dd(a,b){ return Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00'))/86400000); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function blockDays(){ const c=S.summary.find(x=>x.oldest_date && x.block_start_date); return c? dd(c.block_start_date, c.oldest_date) : 181; }
function md(s){ return s ? s.slice(2).replaceAll('-','.') : '-'; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function errMsg(e){ const m=(e && (e.message||e.error_description||e.msg)) || String(e);
  if(/schema must be one of|PGRST106/.test(m)) return '서버 설정 확인 필요: Data API의 Exposed schemas에 receivables가 없습니다.';
  if(/banned/i.test(m)) return '사용 중지된 계정입니다. 관리자에게 문의하세요.';
  if(/Invalid login/.test(m)) return '아이디(이메일) 또는 비밀번호가 맞지 않습니다.';
  if(/same_password|should be different/i.test(m)) return '임시 비밀번호와 다른 비밀번호로 정하세요.';
  if(/row-level security|42501|permission denied/.test(m)) return '권한이 없습니다. (본인 거래처만 입력·수정할 수 있습니다)';
  return m; }

const ID_DOMAIN = 'cso-chart.invalid';

const toLoginEmail = v => { v=(v||'').trim(); return v.includes('@') ? v : `${v.toLowerCase()}@${ID_DOMAIN}`; };

function status(c){
  if(Number(c.balance)===0) return {k:'none', t:'미수금 없음', cls:'c-none'};
  if(Number(c.over_block)>0) return {k:'block', t:'주문 차단', cls:'c-block'};
  if(Number(c.undated_remaining)>0) return {k:'hold', t:'판정 보류', cls:'c-hold'};
  if(c.last_order_date && dd(c.last_order_date, S.base) <= SOON_DAYS) return {k:'soon', t:'곧 차단', cls:'c-soon'};
  return {k:'ok', t:'주문 가능', cls:'c-ok'};
}
const ORDER = {block:0, soon:1, hold:2, ok:3, none:4};

async function loadMe(){
  const uid = S.session.user.id;
  const [{data:adm}, {data:me}] = await Promise.all([
    sb.schema('public').rpc('is_admin'),
    sb.from('members').select('*').eq('user_id', uid).maybeSingle()
  ]);
  S.isAdmin = adm === true; S.me = me || null;
  if(me && me.active===false){ S.loginMsg='사용 중지된 계정입니다. 관리자에게 문의하세요.'; await sb.auth.signOut(); throw Object.assign(new Error('사용 중지된 계정입니다. 관리자에게 문의하세요.'), {inactive:true}); }
  if(S.isAdmin){ const {data} = await sb.from('members').select('*').order('display_name'); S.members = data || []; }
}
async function loadSummary(){
  const [{data, error}, {data:li}] = await Promise.all([sb.rpc('customer_summary', {p_base: S.base}), sb.rpc('last_inputs')]);
  if(error) throw error;
  const last = new Map((li||[]).map(r=>[r.customer_id, kstDate(r.last_input_at)]));
  S.summary = (data||[]).map(c=>({...c, last_input: last.get(c.customer_id)||null, _s: status(c)}))
    .sort((a,b)=> a.customer_name.localeCompare(b.customer_name,'ko') || (a.owner_name||'').localeCompare(b.owner_name||'','ko')); // 거래처 이름 가나다순
}

// 최근 입력: 앱에 마지막으로 거래를 등록한 날 (거래장 날짜가 아님). 30일 넘으면 주황색
const STALE_DAYS = 30;
const kstDate = ts => ts ? new Date(ts).toLocaleDateString('sv-SE', {timeZone:'Asia/Seoul'}) : null;
function lastInputHtml(c, long){
  if(!c.last_input) return '';
  const ago = dd(todayStr(), c.last_input); const old = ago > STALE_DAYS;
  const txt = `${long?c.last_input:md(c.last_input)} (${ago<=0?'오늘':ago+'일 전'})`;
  return long ? `<span style="${old?'color:#b54708;font-weight:700':''}">${txt}</span>`
              : `<span style="flex-basis:100%;${old?'color:#b54708':''}">최근 입력 <b style="${old?'color:#b54708':''}">${txt}</b></span>`;
}

const DIST = [ // 회전일 분포 칸: [키, 이름, 막대 색]
  ['d30','30일','#4C8DFF'],['d60','60일','#6FB1FF'],['d90','90일','#5FD3E0'],['d120','120일','#7EDDB5'],

const BK_LABEL = {d30:'30일',d60:'60일',d90:'90일',d120:'120일',d150:'150일',d180:'180일',over_block:'181일 이상',undated_remaining:'날짜 미상',_soon:'곧 차단'};
const TAGT = {block:'주문 차단', soon:'차단 임박', hold:'판정 보류', none:'미수금 없음'};
function custTag(c){ const k=c._s.k, t=c.turnover_days;
  if(k==='none') return `<span class="tag none">미수금 없음</span>`;
  return `<span class="tag ${k}">${t!=null?t+'일':'회전일 미상'}${TAGT[k]&&k!=='none'?' · '+TAGT[k]:''}</span>`; }
function custSub(c){
  const parts=[]; if(S.isAdmin) parts.push(esc(c.owner_name||'-'));
  if(Number(c.over_block)>0 && c.block_start_date) parts.push(`${sd(c.block_start_date)} 차단됨`);
  else if(c.block_start_date){ const left=dd(c.block_start_date,S.base); parts.push(`${sd(c.block_start_date)} 차단${c._s.k==='soon'?` · D-${left}`:''}`); }
  if(c.last_input){ const ago=dd(todayStr(), c.last_input); parts.push(`<span class="${ago>STALE_DAYS?'old':''}">입력 ${sd(c.last_input)}${ago>STALE_DAYS?` (${ago}일 전)`:''}</span>`); }
  return parts.join(' · ');
}

  app.innerHTML = header('회전일 차트') + `<div class="wrap">

      <div class="mini"><div><div class="l">주문 차단</div><div class="n">${nBlock}처</div></div>
        <div><div class="l">곧 차단<span class="opt"> ${SOON_DAYS}일 내</span></div><div class="n">${nSoon}처</div></div>
        <div><div class="l">181일 초과<span class="opt">분</span></div><div class="n">${won(sum(c=>c.over_block))}원</div></div></div></div>
    <div class="chips">
      ${S.isAdmin?`<label class="chipsel">${IC.team}<select id="own" aria-label="담당자">${[['all','전체 담당자'],...owners].map(([id,n])=>`<option value="${id}" ${S.ownerFilter===id?'selected':''}>${esc(n)}</option>`).join('')}</select>${IC.down}</label>`:''}
      <label class="chipsel">${IC.cal}<input type="date" id="base" value="${S.base}" aria-label="기준일"></label>
    </div>

  base.onchange = async ()=>{ S.base = base.value || todayStr(); await refresh(); };

function toggleSearch(){ if(S.showQ||S.q){ S.showQ=false; S.q=''; } else { S.showQ=true; S.focusQ=true; } viewDash(); }
function setSort(v){ S.sort=v; viewDash(); }

// 정렬: 기본 이름순 / 회전일 긴 순 / 회전일 짧은 순 / 최근 입력 순 (미수금 없는 거래처는 회전일 정렬에서 맨 뒤)
function sortList(arr){
  const byName = (a,b)=> a.customer_name.localeCompare(b.customer_name,'ko') || (a.owner_name||'').localeCompare(b.owner_name||'','ko');
  const t = c => Number(c.balance)>0 && c.turnover_days!=null ? Number(c.turnover_days) : null;
  const mode = S.sort || 'name';
  if(mode==='name') return [...arr].sort(byName);
  if(mode==='inputNew') return [...arr].sort((a,b)=> (b.last_input||'').localeCompare(a.last_input||'') || byName(a,b)); // 최근에 입력한 거래처가 맨 위, 입력 없는 거래처는 맨 뒤
  return [...arr].sort((a,b)=>{ const x=t(a), y=t(b);
    if(x==null && y==null) return byName(a,b); if(x==null) return 1; if(y==null) return -1;
    return (mode==='turnDesc' ? y-x : x-y) || byName(a,b); });
}
// 거래처 하나를 회전일 기준 한 칸에 배정 (회사 열 구간과 같은 경계, 181일 이상 = 차단)
function bucketOf(c){
  if(!Number(c.balance)) return null;
  const t = c.turnover_days;
  if(t==null || (Number(c.undated_remaining)>0 && t < blockDays())) return 'undated_remaining';
  if(t >= blockDays()) return 'over_block';
  return t<=30?'d30': t<=60?'d60': t<=90?'d90': t<=120?'d120': t<=150?'d150':'d180';
}
function pickBucket(k){ S.bucket = (k && S.bucket!==k) ? k : null; viewDash(); if(S.bucket) document.getElementById('listTop')?.scrollIntoView({behavior:'smooth', block:'start'}); }

    if(error){ msg.textContent = /duplicate|unique|23505/.test(error.message+error.code) ? '같은 담당자에게 이미 같은 이름의 거래처가 있습니다.' : errMsg(error); return; }

async function openCust(id, replace){ pushNav({v:'detail', id}, replace); S.custId=id; S.view='detail'; await viewDetail(); }
function runCheck(entries){
  let rb=0; return entries.map(e=>{
    const counted = e.status==='확정';
    if(counted) rb += Number(e.sale_amount) - Number(e.pay_amount);
    const mism = counted && e.ledger_balance!=null && Number(e.ledger_balance)!==rb;
    return {...e, _rb: counted? rb : null, _mis: mism};
  });
}
function sortEntries(a,b){ if((a.kind==='이월')!==(b.kind==='이월')) return a.kind==='이월'?-1:1;
  if(a.entry_date!==b.entry_date){ if(!a.entry_date) return -1; if(!b.entry_date) return 1; return a.entry_date<b.entry_date?-1:1; }
  return Number(a.seq)-Number(b.seq); }

      ${c.last_order_date?`<div><span>마지막 주문 가능일</span><b>${c.last_order_date}</b></div><div><span>차단 시작</span><b style="${s.k==='block'||s.k==='soon'?'color:var(--red)':''}">${c.block_start_date}</b></div>`:''}
      ${S.isAdmin?`<div><span>담당자</span><select class="i" id="ownSel">${S.members.map(m=>`<option value="${m.user_id}" ${m.user_id===c.owner_id?'selected':''}>${esc(m.display_name)}${m.active===false?' (사용 중지)':''}</option>`).join('')}</select></div>`:''}
      ${c.last_input?`<div><span>최근 입력</span><b>${lastInputHtml(c, true)}</b></div>`:''}
    </div>

    <div class="dist">${DIST.map(bd).join('')}</div>
    <div id="ordCard" style="scroll-margin-top:70px"><h2 class="sh">주문발생 <span class="s">오래된 순 · 남은 미수</span></h2><div id="ordBody">${ordersHtml()}</div></div>

const PAGE=10;
const moreBtn=(left, fn)=> left>0 ? `<button type="button" class="more" onclick="${fn}">더 보기</button>` : '';
function moreEnt(){ S.entN+=PAGE; document.getElementById('entBody').innerHTML=entsHtml(); }
function moreOrd(){ S.ordN+=PAGE; document.getElementById('ordBody').innerHTML=ordersHtml(); }
// 남은 채권의 회전일 구간 (customer_summary의 d30~d180·over_block·undated_remaining과 같은 기준)
function bucketKey(i){ const a=i.age_days; if(a==null) return 'undated_remaining'; if(a>=blockDays()) return 'over_block';
  return a<=30?'d30':a<=60?'d60':a<=90?'d90':a<=120?'d120':a<=150?'d150':'d180'; }
function ordersHtml(){
  const all=S.detItems||[]; const items = S.detBucket ? all.filter(i=>bucketKey(i)===S.detBucket) : all;
  const head = S.detBucket ? `<div class="filt"><span class="grow">${esc(S.detBucketLbl)} 구간 ${items.length}건 · ${won(items.reduce((t,i)=>t+Number(i.remaining),0))}원</span><button onclick="clearBucket()">전체 보기</button></div>` : '';
  if(!all.length) return '<div class="muted">남은 채권이 없습니다.</div>';

  const cls = i => i.age_days==null ? 'hold' : i.age_days>=blockDays() ? 'block' : i.age_days>=blockDays()-31 ? 'soon' : 'ok';
  return head + (items.length? shown.map(i=>{ const k=cls(i); return `<div class="ord"><div class="m"><div class="t1">${esc(i.item||i.kind)}</div>
      <div class="tags"><span class="tag ${k}">${i.age_days!=null?i.age_days+'일':'날짜 미상'}${k==='block'?' · 주문 차단':''}</span><span class="s">${i.entry_date?md(i.entry_date)+' 발생 · 마감 '+md(addDays(i.entry_date, blockDays()-1)):'이월'}</span></div></div>
      <div class="r" style="${k==='block'?'color:var(--red)':''}">${won(i.remaining)}</div></div>`; }).join('') + moreBtn(items.length-shown.length,'moreOrd()')
    : '<div class="muted">이 구간의 주문이 없습니다.</div>');
}
function clearBucket(){ S.detBucket=null; S.ordN=PAGE; document.querySelectorAll('.bk').forEach(x=>x.classList.remove('sel')); document.getElementById('ordBody').innerHTML = ordersHtml(); }
function addMonths(s,n){ const d=new Date(s+'T00:00:00'); d.setMonth(d.getMonth()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// 관리자가 직원 거래처에 입력할 때는 '병원명 (담당: 직원)'으로 구분 (직원 화면에는 본인 거래처만 있으므로 해당 없음)
const isOther = c=> S.isAdmin && c.owner_id!==S.session.user.id;
const custLabel = c=> isOther(c) ? `${c.customer_name} (담당: ${c.owner_name||'-'})` : c.customer_name;
function custOptions(){
  const me=S.session.user.id, mineNames=new Set(S.summary.filter(c=>c.owner_id===me).map(c=>c.customer_name));
  return S.summary.filter(c=>!isOther(c) || !mineNames.has(c.customer_name)).map(c=>`<option value="${esc(custLabel(c))}">`).join('');
}
// 입력 칸 글자 → 거래처 (본인 거래처 이름, 또는 관리자만 '병원명 (담당: 직원)')
function findCust(text){
  const t=(text||'').trim(); if(!t) return null; const me=S.session.user.id;
  return S.summary.find(c=>c.owner_id===me && c.customer_name===t) || (S.isAdmin ? S.summary.find(c=>isOther(c) && custLabel(c)===t) : null) || null;
}
function custHint(c, bal){ if(!c) return '';
  return isOther(c) ? `${c.owner_name||'-'}님 거래처입니다.${bal!=null?` 지금 잔액 ${won(bal)}원에 이어서 계산합니다.`:''}` : (bal!=null?`기존 거래처입니다. 지금 잔액 ${won(bal)}원에 이어서 계산합니다.`:''); }
// keep=true: 거래처 상세에서 누른 경우만 그 거래처 이름을 미리 채움. 첫 화면에서는 항상 빈칸
function openEntry(keep){ pushNav({v:'entry', keep:!!keep}); if(!keep) S.entryCustName=''; S.view='entry'; viewEntry(); }
function viewEntry(msg, ok){
  app.innerHTML = header('거래 입력', true) + `<div class="wrap"><form id="ef" class="card">
    <label class="f">거래처 (처음 입력하면 자동으로 생성됩니다)</label>

  let kind='판매';
  kd.querySelectorAll('button').forEach(b=>b.onclick=()=>{ kd.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); kind=b.dataset.k;
    dh.textContent = kind==='이월'?'(모르면 비워 두세요)':''; if(kind==='이월') dt.value=''; else if(!dt.value) dt.value=todayStr();
    // 수금은 품목이 없으니 적요를 '수금'으로 자동 입력 (카드·현금 등으로 고쳐 써도 됨). 다른 구분으로 바꾸면 자동 입력분만 지움

async function customerIdFor(name){
  const found = findCust(name); // 관리자가 '병원명 (담당: 직원)'을 고르면 그 직원 거래처에 저장 (담당자는 그대로)
  if(found) return found.customer_id;
  const {data, error} = await sb.rpc('ensure_customer', {p_name:name}); if(error) throw error; return data;
}
async function ledgerCheck(cid, lbv){
  const {data} = await sb.from('entries').select('*').eq('customer_id', cid);
  const rows = runCheck((data||[]).sort(sortEntries)); const last = [...rows].reverse().find(r=>r._rb!=null);
  if(lbv==null || !last) return last? `계산 잔액 ${won(last._rb)}원` : '';
  return Number(lbv)===last._rb ? `거래장 잔액 ${won(lbv)}원과 일치 ✓` : `거래장 잔액과 불일치 ⚠ (계산 ${won(last._rb)} / 거래장 ${won(lbv)}, 차이 ${won(Number(lbv)-last._rb)})`;
}

// ===== 여러 줄 입력 (표로 입력 · 📷 사진 · 엑셀 붙여넣기) =====
const blankRow = (date)=>({date: date||todayStr(), kind:'판매', amt:null, item:'', lb:null, flag:'', skip:false});
function openPaste(photo, keep){
  pushNav({v:'paste', photo:!!photo, keep:!!keep});
  if(!keep) S.entryCustName=''; S.view='paste'; S.photoMode=!!photo; S.photoIds=[];

}
// 사진 축소 (긴 변 2400px, JPEG) → 업로드 용량·읽기 비용 절감
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>no(new Error('사진을 열 수 없습니다. (JPG/PNG로 다시 시도)')); i.src=url;});
    const k=Math.min(1, 2400/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.88));
  } finally { URL.revokeObjectURL(url); }
}
// 사진 → 서버에서 읽기 → 표의 줄로 변환
async function readPhotos(files, onStatus){
  const uid=S.session.user.id; const all=[]; let name='';
  for(let n=0;n<files.length;n++){
    onStatus(`${n+1}/${files.length}장 올리는 중...`);
    const blob=await shrink(files[n]);
    const path=`${uid}/${Date.now()}-${n}.jpg`;
    const up=await sb.storage.from('ledger-photos').upload(path, blob, {contentType:'image/jpeg'}); if(up.error) throw up.error;
    const ph=await sb.from('photos').insert({storage_path:path}).select('id').single(); if(ph.error) throw ph.error;
    S.photoIds.push(ph.data.id);
    onStatus(`${n+1}/${files.length}장 읽는 중... (10~30초)`);
    const {data, error}=await sb.functions.invoke('read-ledger',{body:{photo_id:ph.data.id}});
    if(error){ let m=error.message; try{ const b=await error.context.json(); m=b.message||m; }catch(_){} throw new Error(m); }
    if(!name && data.customer_name) name=data.customer_name;
    all.push(...data.rows.map(r=>({...r, _photo:n, _model:data.model})));
  }
  // 겹쳐 찍은 사진의 같은 줄(날짜·구분·금액 같고, 잔액이 있으면 잔액도 같음)은 중복 의심 → 기본 '저장 안 함'
  //  주문현황·수금현황처럼 잔액 칸이 없는 화면도 날짜·구분·금액으로 잡아냄 (같은 사진 안의 같은 줄은 중복으로 보지 않음)
  const firstPhoto = {};
  const rows = all.map(r=>{ const key=[r.date,r.kind,r.amount,r.balance??''].join('|');
    const dup = firstPhoto[key]!=null && firstPhoto[key]!==r._photo;
    if(firstPhoto[key]==null) firstPhoto[key]=r._photo;
    const flag = dup?'dup': r.unclear?'unc':'';
    return {date:r.date||null, kind:r.kind||'판매', amt:r.amount??null, item:r.item||'', lb:r.balance??null, flag, skip:!!flag, fixed:!!r.fixed}; });
  return {name, rows, models:[...new Set(all.map(r=>r._model))]};
}
const KIND_MAP = {'판매':'판매','매출':'판매','출고':'판매','수금':'수금','입금':'수금','이월':'이월','전기이월':'이월','전월이월':'이월','반품':'반품','할인':'매출할인','매출할인':'매출할인'};
function parseDate(s){ s=(s||'').trim(); if(!s) return null; const m=s.replace(/[./년월]/g,'-').replace(/일/,'').match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})/);
  if(!m) return undefined; let y=Number(m[1]); if(y<100) y+=2000; return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`; }
function num(s){ const v=String(s??'').replace(/[^0-9-]/g,''); return v===''||v==='-'?null:Number(v); }
// 엑셀에서 복사한 표(일자/구분/금액/품목/거래장잔액) → 표의 줄
function parsePaste(txt){
  return txt.split(/\r?\n/).map(l=>l.replace(/^[ ]+|[ ]+$/g,'')).filter(l=>l.replace(/\t/g,'').trim()).map(l=>{
    const c = l.includes('\t')? l.split('\t') : l.split(/,(?![0-9]{3})/);
    let kind=KIND_MAP[(c[1]||'').replace(/\s/g,'')]||'판매';
    const d=parseDate(c[0]); let amt=num(c[2]);
    if(amt!=null && amt<0){ if(kind==='판매') kind=/할인/.test(c[3]||'')?'매출할인':'반품'; amt=Math.abs(amt); } // 거래장의 마이너스 판매 = 반품
    return {date: d||null, kind, amt, item:(c[3]||'').trim(), lb:num(c[4]), flag: d===undefined?'date':'', skip:false};
  });
}
const isBlank = r => !r.amt && !r.item && r.lb==null;
const entryKey = (d,k,a)=> [d||'', k, Number(a)||0].join('|');
// 이 거래처에 이미 저장된 거래와 날짜·구분·금액이 같은 줄 → '이미 저장된 거래'로 표시하고 기본 '저장 안 함'
function markExisting(){
  const ex = S.existKeys||new Set(); let changed=false;
  const hasPrev = ex.size>0; // 이미 거래가 있는 거래처
  S.rows.forEach(r=>{ if(isBlank(r)) return;
    // 기존 거래처에 새 거래장을 올리면 맨 위 '전기이월'은 이미 반영된 잔액 → 기본 '저장 안 함' (처음 등록하는 거래처는 그대로 저장)
    if(r.kind==='이월' && hasPrev){ if(r.flag!=='carry'){ r.flag='carry'; r.skip=true; changed=true; } return; }
    if(r.flag==='carry'){ r.flag=''; r.skip=false; changed=true; }
    if(ex.has(entryKey(r.date, r.kind, r.amt))){ if(r.flag!=='exist'){ r.flag='exist'; r.skip=true; changed=true; } }
    else if(r.flag==='exist'){ r.flag=''; r.skip=false; changed=true; } });
  return changed;
}
function isCredit(k){ return k==='수금' || k==='반품' || k==='매출할인'; } // 가장 오래된 미수부터 차감
function rowError(r){
  if(r.skip) return '';
  if(r.flag==='date') return '날짜를 다시 골라주세요';
  if(!r.date && r.kind!=='이월') return '일자를 넣어주세요';
  if(r.amt==null) return '금액을 넣어주세요';
  if(r.amt===0 && r.kind!=='판매') return '금액을 넣어주세요'; // 0원은 판매(첨부·무상 품목)만 허용
  return '';
}
// 줄마다 계산 잔액·대조 결과 (저장 안 함·빈 줄 제외)
function evalRows(){
  let rb = S.startBal||0;
  return S.rows.map(r=>{
    if(isBlank(r)) return {state:'blank'};
    if(r.skip) return {state:'skip'};
    const err = rowError(r); if(err) return {state:'err', msg:err};
    rb += isCredit(r.kind) ? -r.amt : r.amt;
    if(r.amt===0 && (r.lb==null || r.lb===rb)) return {state:'ok', zero:true, rb, msg:`0원 품목 (첨부·무상) · 잔액 변동 없음${r.lb!=null?' ✓':''}`};
    if(r.lb==null) return {state:'ok', rb, msg:`계산 잔액 ${won(rb)}`};
    return r.lb===rb ? {state:'ok', rb, msg:`거래장 잔액과 일치 ✓`} : {state:'mis', rb, msg:`불일치 ⚠ 계산 ${won(rb)} / 거래장 ${won(r.lb)}`};
  });
}
function rowHtml(r,i){
  const fmt = v => v==null||v===''?'':Number(v).toLocaleString('ko-KR');
  return `<div class="mrow" data-i="${i}">
    <div class="mhead"><b>${i+1}</b>
      ${r.flag==='dup'||r.flag==='unc'||r.flag==='exist'||r.flag==='carry'?`<label class="mskip"><input type="checkbox" data-f="skip" ${r.skip?'checked':''}> 저장 안 함 <span class="muted">(${r.flag==='dup'?'앞 사진과 같은 줄':r.flag==='exist'?'이미 저장된 거래':r.flag==='carry'?'기존 거래처라 이월 제외':'사진 글자가 흐림'})</span></label>`:''}
      <span class="grow"></span><button type="button" class="mdel" data-del="${i}" aria-label="이 줄 삭제">🗑</button></div>
    <div class="mgrid">
      <label>일자<input class="i" type="date" data-f="date" value="${r.date||''}"></label>
      <label>구분<select class="i" data-f="kind">${['판매','수금','이월','반품','매출할인'].map(k=>`<option ${r.kind===k?'selected':''}>${k}</option>`).join('')}</select></label>
      <label>금액<input class="i" data-f="amt" inputmode="numeric" placeholder="0" value="${fmt(r.amt)}"></label>
      <label>거래장 잔액<input class="i" data-f="lb" inputmode="numeric" placeholder="선택" value="${fmt(r.lb)}"></label>
      <label class="span2">품목 / 적요<input class="i" data-f="item" placeholder="예: 하이알포르테주" value="${esc(r.item||'')}"></label>
    </div>
    <div class="mst" data-st></div>
  </div>`;
}
function paintStatus(){
  const ev = evalRows(); let save=0, bad=0, skip=0;
  document.querySelectorAll('#rows .mrow').forEach(el=>{
    const e = ev[+el.dataset.i]; const st = el.querySelector('[data-st]');
    el.classList.remove('ok','mis','err','skip','zero'); if(e.zero) el.classList.add('zero');
    if(e.state==='blank'){ st.textContent=''; return; }
    el.classList.add(e.state); st.textContent = e.state==='skip' ? '저장하지 않습니다' : ((S.rows[+el.dataset.i]?.fixed && e.state!=='err') ? '🔁 금액·잔액 위아래 자동 교정 · ' : '') + e.msg;
    if(e.state==='ok') save++; else if(e.state==='mis'){ save++; bad++; } else if(e.state==='err') bad++; else skip++;
  });
  const name = (document.getElementById('pc')||{}).value?.trim();
  document.getElementById('msum').innerHTML = `저장할 줄 <b>${save}</b>${bad?` · <span style="color:var(--red)">확인 필요 ${bad}</span>`:''}${skip?` · 저장 안 함 ${skip}`:''}`
    + (ev.some(e=>e.state==='mis')?'<div class="muted">불일치 줄은 \'확인대기\'로 저장됩니다.</div>':'');
  document.getElementById('ps').disabled = !name || !save || ev.some(e=>e.state==='err');
}
function renderRows(){ document.getElementById('rows').innerHTML = S.rows.map(rowHtml).join(''); paintStatus(); }
async function loadStartBal(){
  const name=pc.value.trim(); const ex = findCust(name);
  S.startBal=0; S.startCust=ex?ex.customer_id:null; S.existKeys=new Set();
  if(ex){ const {data}=await sb.from('entries').select('*').eq('customer_id',ex.customer_id);
    (data||[]).forEach(e=>S.existKeys.add(entryKey(e.entry_date, e.kind, isCredit(e.kind)?e.pay_amount:e.sale_amount)));
    const r=runCheck((data||[]).sort(sortEntries)).reverse().find(x=>x._rb!=null); S.startBal=r?r._rb:0; }
  if(markExisting()) renderRows(); // 표시가 바뀐 줄이 있을 때만 다시 그림 (입력 중인 칸 보호)
  document.getElementById('mstart').textContent = ex ? custHint(ex, S.startBal) : (name?'새 거래처로 만들어집니다.':'');
  paintStatus();
}

  app.innerHTML = header(S.photoMode?'사진으로 입력':'여러 줄 입력', true) + `<div class="wrap"><div class="card">
    <label class="f">거래처</label><input class="i" id="pc" list="cl2" value="${esc(S.entryCustName)}" placeholder="병원이름"><datalist id="cl2">${custOptions()}</datalist>
    <div id="mstart" class="muted" style="margin-top:6px"></div>
    <label class="btn ${S.photoMode?'':'sec'}" style="display:block;text-align:center;margin-top:12px">${IC.cam} 거래장 사진으로 채우기<input type="file" id="pf" accept="image/*" multiple hidden></label>
    <div id="pst" class="muted" style="margin-top:6px">여러 장이면 위에서부터 찍은 순서대로 고르세요. 읽은 결과가 아래 표에 채워지고, 틀린 칸만 고치면 됩니다.</div>
  </div>
  <div id="rows"></div>

    if(f==='amt'||f==='lb'){ const v=num(el.value); r[f]=v==null?null:Math.abs(v); el.value = r[f]==null?'':r[f].toLocaleString('ko-KR'); }
    else if(f==='skip') r.skip = el.checked;

  });

  box.addEventListener('paste', e=>{
    const t=(e.clipboardData||window.clipboardData)?.getData('text')||''; if(!/[\t\n]/.test(t.trim())) return;
    e.preventDefault(); const add=parsePaste(t); if(!add.length) return;
    while(S.rows.length && isBlank(S.rows[S.rows.length-1])) S.rows.pop();
    S.rows.push(...add); markExisting(); renderRows(); toast(`${add.length}줄을 채웠습니다.`);
  });
  addRow.onclick = ()=>{ const last=S.rows[S.rows.length-1]; S.rows.push(blankRow(last&&last.date)); renderRows();
    const els=document.querySelectorAll('#rows .mrow'); els[els.length-1].scrollIntoView({block:'center'}); };
  pf.onchange = async ()=>{

    const st=document.getElementById('pst'); st.className='muted';

      while(S.rows.length && isBlank(S.rows[S.rows.length-1])) S.rows.pop();

        input_method: S.photoMode?'사진':'엑셀', photo_id: S.photoIds[0]||null, status: e.state==='mis'?'확인대기':'확정'}));
      for(const row of ins){ const {error}=await sb.from('entries').insert(row); if(error) throw error; } // 한 줄씩 넣어 순서 보존
      if(S.photoIds.length) await sb.from('photos').update({status:'확인완료', customer_id:cid}).in('id', S.photoIds);
      S.entryCustName=''; await refresh(false); toast(`${ins.length}줄 저장했습니다.`);
      const c=S.summary.find(x=>x.customer_id===cid); if(c){ openCust(cid, true); } else go('dash');
    }catch(er){ perr.textContent=errMsg(er); ps.disabled=false; }

// ===== 엑셀 내려받기 (거래처 요약) =====
// 관리자: 전체 / 담당자별로 골라서 받기. 동료: 본인 거래처만 (서버 권한상 본인 것만 불러와짐)
const EXCELJS_URL = 'exceljs.min.js?v=4.4.0'; // ExcelJS 4.4.0 (MIT), 앱과 같은 곳에 올려 두고 누를 때만 불러옴
function loadExcelJS(){ if(window.ExcelJS) return Promise.resolve();
  return new Promise((ok, no)=>{ const sc=document.createElement('script'); sc.src=EXCELJS_URL; sc.onload=()=>ok(); sc.onerror=()=>no(new Error('엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인하세요.')); document.head.appendChild(sc); }); }
function askExport(){

    <h3>엑셀로 받기 · 거래처 요약</h3><div class="muted">기준일 ${S.base} 기준으로 만듭니다.</div>
    <div style="margin:12px 0;display:flex;flex-direction:column;gap:6px">
      ${[['all','전체 담당자']].concat(owners).map(([id,n])=>`<label class="row" style="gap:8px;padding:8px 4px;cursor:pointer"><input type="radio" name="xo" value="${id}" ${id===cur?'checked':''} style="width:18px;height:18px"><span class="grow">${esc(n)}${id===S.session.user.id?' (나)':''}</span><span class="muted">${cnt(id)}처</span></label>`).join('')}
    </div>
    <div class="row" style="gap:8px"><button class="btn sec grow" onclick="document.getElementById('xbox').remove()">취소</button><button class="btn grow" id="xgo">내려받기</button></div></div>`;

async function doExport(who){
  const me=S.session.user.id;
  const list = sortList(S.summary.filter(c=> who==='all' ? true : who==='me' ? c.owner_id===me : c.owner_id===who)).filter(c=>c); // 정렬은 화면과 같게
  if(!list.length){ toast('받을 거래처가 없습니다.'); return; }
  const label = who==='all' ? '전체' : (list[0].owner_name||'담당자');
  toast('엑셀 파일을 만드는 중...');
  try{ await loadExcelJS(); }catch(e){ toast(e.message); return; }
  const wb=new ExcelJS.Workbook(); const ws=wb.addWorksheet('거래처 요약', {views:[{state:'frozen', xSplit:1, ySplit:4, showGridLines:false}]});
  const F={name:'맑은 고딕', size:10}; const thin={style:'thin', color:{argb:'FFD0D7E2'}}; const BOX={top:thin,left:thin,bottom:thin,right:thin};
  const fill=c=>({type:'pattern', pattern:'solid', fgColor:{argb:c}}); const NUM='#,##0;-#,##0;"-"';
  const toDate=s=> s? new Date(s+'T00:00:00Z') : null;
  ws.getCell('A1').value='회전일 차트 · 거래처 요약'+(who==='all'?'':` (${label})`); ws.getCell('A1').font={...F, size:14, bold:true};
  ws.getCell('A2').value=`기준일 ${S.base}  ·  회전일 = 가장 오래된 미수(선입선출) 경과일  ·  ${blockDays()}일부터 주문 차단`; ws.getCell('A2').font={...F, color:{argb:'FF5B6576'}};
  const H=['거래처','담당자','판정','미수 잔액','회전일','30일\n(0~30)','60일\n(31~60)','90일\n(61~90)','120일\n(91~120)','150일\n(121~150)',`180일\n(151~${blockDays()-1})`,`${blockDays()}일↑\n(차단)`,'날짜 미상','마지막\n주문 가능일','차단 시작','최근 입력'];
  const W=[16,12,10,13,11,12,12,12,12,12,12,12,10,12,12,12]; W.forEach((w,i)=>ws.getColumn(i+1).width=w);
  const hr=ws.getRow(4); hr.height=32;
  H.forEach((h,i)=>{ const c=hr.getCell(i+1); c.value=h; c.font={...F, bold:true, color:{argb:'FFFFFFFF'}}; c.fill=fill('FF1F3A6E'); c.alignment={horizontal:'center', vertical:'middle', wrapText:true}; c.border=BOX; });
  const keys=['d30','d60','d90','d120','d150','d180','over_block','undated_remaining'];
  list.forEach((c,k)=>{ const r=5+k, row=ws.getRow(r); const st=c._s;
    const vals=[c.customer_name, c.owner_name||'', st.t, null, c.turnover_days, ...keys.map(x=>Number(c[x])||0), toDate(c.last_order_date), toDate(c.block_start_date), toDate(c.last_input)];
    vals.forEach((v,i)=>{ const cell=row.getCell(i+1); cell.value=v; cell.font={...F}; cell.border=BOX; });
    row.getCell(4).value={formula:`SUM(F${r}:M${r})`, result:Number(c.balance)||0};
    for(let i=4;i<=13;i++) row.getCell(i).numFmt=NUM;
    row.getCell(5).numFmt='0"일"'; row.getCell(3).alignment={horizontal:'center'};
    [14,15,16].forEach(i=>{ row.getCell(i).numFmt='yyyy-mm-dd'; row.getCell(i).alignment={horizontal:'center'}; });
    const bg = st.k==='block' ? 'FFFDE4E2' : st.k==='soon' ? 'FFFFF1DC' : null;
    if(bg) for(let i=1;i<=H.length;i++) row.getCell(i).fill=fill(bg);
    if(st.k==='block') row.getCell(3).font={...F, bold:true, color:{argb:'FFB42318'}};
    if(c.last_input && dd(todayStr(), c.last_input) > STALE_DAYS) row.getCell(16).font={...F, bold:true, color:{argb:'FFB54708'}};
  });
  const last=4+list.length, t=last+1, tr=ws.getRow(t); const col=i=>String.fromCharCode(64+i);
  const blocked=list.filter(c=>c._s.k==='block').length;
  tr.getCell(1).value='합계';
  tr.getCell(2).value={formula:`COUNTA(A5:A${last})&"처"`, result:`${list.length}처`};
  tr.getCell(3).value={formula:`COUNTIF(C5:C${last},"주문 차단")&"처 차단"`, result:`${blocked}처 차단`};
  for(let i=4;i<=13;i++){ if(i===5) continue; tr.getCell(i).value={formula:`SUM(${col(i)}5:${col(i)}${last})`, result:list.reduce((a,c)=>a+(Number(i===4?c.balance:c[keys[i-6]])||0),0)}; tr.getCell(i).numFmt=NUM; }
  tr.getCell(5).value={formula:`MAX(E5:E${last})`, result:Math.max(0,...list.map(c=>Number(c.turnover_days)||0))}; tr.getCell(5).numFmt='"최장 "0"일"';
  for(let i=1;i<=H.length;i++){ const c=tr.getCell(i); c.font={...F, bold:true}; c.fill=fill('FFE8EEF7'); c.border=BOX; }
  ws.getCell(`A${t+2}`).value='색 표시: 빨강 = 주문 차단 · 주황 = 30일 안에 차단 · 최근 입력 주황 글씨 = 30일 넘게 입력 없음'; ws.getCell(`A${t+2}`).font={...F, color:{argb:'FF5B6576'}};
  ws.getCell(`A${t+3}`).value=`${new Date().toLocaleString('ko-KR')} 회전일 차트에서 내려받음 · 금액은 거래장 기준(부가세 포함)`; ws.getCell(`A${t+3}`).font={...F, color:{argb:'FF5B6576'}};
  ws.autoFilter={from:'A4', to:`P${last}`};
  const buf=await wb.xlsx.writeBuffer();
  const name=`회전일차트_거래처요약_${who==='all'?'전체':label}_${S.base}.xlsx`;
  const blob=new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  // 휴대폰에서 공유(카톡 등)할 수 있으면 공유 창, 아니면 바로 다운로드
  const file = new File([blob], name, {type:blob.type});
  if(navigator.canShare && /Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('엑셀 파일을 받았습니다.');
}

// 헷갈리는 글자(0/o, 1/l/i) 뺀 임시 비밀번호 8자: 영문 4 + 숫자 4
function tempPw(){ const L='abcdefghjkmnpqrstuvwxyz', D='23456789'; const r=n=>{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; };
  let s=''; for(let i=0;i<4;i++) s+=L[r(L.length)]; for(let i=0;i<4;i++) s+=D[r(D.length)]; return s; }
function credText(c){ return `[회전일 차트]\n주소: ${APP_URL}\n아이디: ${c.id}\n임시 비밀번호: ${c.pw}\n처음 로그인하면 새 비밀번호를 정하는 화면이 나옵니다.`; }
function credBox(c){
  return `<div class="card" style="border:2px solid #9bd3ae;background:#f2fbf5"><h3>✅ ${esc(c.title)}</h3>
    <div class="muted">아래 내용을 복사해서 카톡 등으로 동료에게 보내세요. 이 화면을 벗어나면 임시 비밀번호는 다시 볼 수 없습니다.</div>
    <pre id="credTxt" style="white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;font-family:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;font-size:15px">${esc(credText(c))}</pre>
    <button class="btn" style="width:100%" onclick="copyCred()">복사하기</button></div>`;
}
async function copyCred(){ const t=document.getElementById('credTxt').textContent;
  try{ await navigator.clipboard.writeText(t); toast('복사했습니다.'); }
  catch(_){ const r=document.createRange(); r.selectNodeContents(document.getElementById('credTxt')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('글자가 선택되었습니다. 길게 눌러 복사하세요.'); } }
// 담당자 표시 이름 변경 (관리자). 거래처·거래 내역에는 영향 없음
function editMemberName(uid){
  const m = S.members.find(x=>x.user_id===uid); if(!m) return;
  const td = document.getElementById('mn-'+uid);
  td.innerHTML = `<form id="mnf" style="display:flex;gap:6px;flex-wrap:wrap"><input class="i" id="mnIn" maxlength="20" value="${esc(m.display_name)}" style="flex:1 1 100%" autocomplete="off">
    <button class="btn sm">저장</button><button type="button" class="btn sm sec" onclick="viewTeam()">취소</button><div id="mnMsg" class="err" style="flex-basis:100%"></div></form>`;
  const inp=document.getElementById('mnIn'); inp.focus(); inp.select();
  document.getElementById('mnf').onsubmit = async e=>{
    e.preventDefault(); const nm=inp.value.trim().replace(/\s+/g,' '); const msg=document.getElementById('mnMsg');
    if(!nm){ msg.textContent='이름을 입력하세요.'; return; }
    if(nm===m.display_name){ viewTeam(); return; }
    const {error} = await sb.from('members').update({display_name:nm}).eq('user_id', uid);
    if(error){ msg.textContent=errMsg(error); return; }
    if(uid===S.session.user.id && S.me) S.me.display_name=nm;
    await loadSummary().catch(()=>{}); await viewTeam(); toast(`이름을 '${nm}'(으)로 바꿨습니다.`);
  };
}
async function setActive(uid, on){
  const m = S.members.find(x=>x.user_id===uid); if(!m) return;
  if(!confirm(on ? `${m.display_name}님 계정을 다시 사용하게 할까요?` : `${m.display_name}님 계정을 사용 중지할까요?\n(바로 로그인·조회가 막힙니다. 거래처와 거래 내역은 그대로 남습니다)`)) return;
  const {error} = await sb.functions.invoke('manage-member', {body:{action: on?'enable':'disable', user_id:uid}});
  if(error){ let msg=error.message; try{ const b=await error.context.json(); msg=b.message||msg; }catch(_){} toast(msg); return; }
  await viewTeam(); toast(on ? `${m.display_name}님 계정을 다시 사용합니다.` : `${m.display_name}님 계정을 사용 중지했습니다.`);
}
async function resetPw(uid){
  const m = S.members.find(x=>x.user_id===uid); if(!m) return;
  if(!confirm(`${m.display_name}님의 비밀번호를 새 임시 비밀번호로 바꿀까요?\n(지금 쓰던 비밀번호로는 더 이상 로그인할 수 없습니다)`)) return;
  const pwv = tempPw();
  const {error} = await sb.functions.invoke('manage-member', {body:{action:'reset', user_id:uid, password:pwv}});
  if(error){ let msg=error.message; try{ const b=await error.context.json(); msg=b.message||msg; }catch(_){} toast(msg); return; }
  await viewTeam(null, true, {title:`${m.display_name}님 비밀번호를 초기화했습니다.`, id:shownId(m.login_id), pw:pwv});
  window.scrollTo(0,0);
}

// ===== 설명서 (관리자 전용) =====
// PDF는 암호화된 파일(guide.bin, admin.bin)로 앱과 함께 올라가 있고, 여는 열쇠는 관리자만 서버에서 받을 수 있음
const DOCS = {
  guide: {file:'guide.bin', name:'회전일 차트 사용 설명서.pdf', title:'회전일 차트 사용 설명서', desc:'동료(담당자)용. 시작하기·로그인·차트 보기·거래 입력·계산 기준·자주 묻는 질문', share:true},
  admin: {file:'admin.bin', name:'회전일 차트 관리자 설명서.pdf', title:'회전일 차트 관리자 설명서', desc:'관리자 본인용. 동료 초대·담당자 변경·설정·비용', share:false}
};
const DOC_VER = '20261102b';
const docCache = {};
async function loadDoc(k){
  if(docCache[k]) return docCache[k];
  const {data:keyB64, error} = await sb.schema('public').rpc('get_docs_key');
  if(error || !keyB64) throw new Error('관리자만 열 수 있습니다.');
  const res = await fetch(`${DOCS[k].file}?v=${DOC_VER}`); if(!res.ok) throw new Error('설명서 파일을 불러오지 못했습니다.');
  const buf = new Uint8Array(await res.arrayBuffer());
  const raw = Uint8Array.from(atob(keyB64), c=>c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pdf = await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, key, buf.slice(12));
  return (docCache[k] = new File([pdf], DOCS[k].name, {type:'application/pdf'}));
}
async function docAction(k, act){
  const w = act==='view' ? window.open('', '_blank') : null; // 팝업 차단 방지
  try{
    const f = await loadDoc(k); const url = URL.createObjectURL(f);
    if(act==='view'){ if(w) w.location.href=url; else location.href=url; }
    else if(act==='save'){ const a=document.createElement('a'); a.href=url; a.download=f.name; a.rel='noopener'; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(), 1000); }
    else if(act==='share'){
      if(navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f], title:DOCS[k].title});
      else { const a=document.createElement('a'); a.href=url; a.download=f.name; a.click(); toast('이 기기는 바로 공유가 안 돼서 파일로 받았습니다. 받은 파일을 카톡 등으로 보내세요.'); }
    }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ if(w) w.close(); if(e && e.name==='AbortError') return; toast(errMsg(e)); }
}
function openDocs(){
  if(!S.isAdmin){ go('dash'); return; }
  pushNav({v:'docs'}); S.view='docs';
  app.innerHTML = header('설명서', true) + `<div class="wrap">
    ${Object.entries(DOCS).map(([k,d])=>`<div class="card"><h3>${esc(d.title)}</h3><div class="muted">${esc(d.desc)}</div>
      <div class="row" style="margin-top:12px">
        <button class="btn sm sec" onclick="docAction('${k}','view')">보기</button>
        <button class="btn sm sec" onclick="docAction('${k}','save')">PDF 받기</button>
        ${d.share?`<button class="btn sm" onclick="docAction('${k}','share')">공유하기 (카톡·문자·메일)</button>`:'<span class="muted">동료에게 보내지 마세요</span>'}
      </div></div>`).join('')}
    <div class="muted">설명서는 관리자만 이 화면에서 볼 수 있습니다. 동료에게는 사용 설명서 PDF를 공유해 주세요.</div>
  </div>`;
}

// ===== 흐름 =====
async function refresh(rerender=true){
  try{ await loadSummary(); }catch(e){ toast(errMsg(e)); }
  if(!rerender) return;
  if(S.view==='detail') await viewDetail(); else if(S.view==='dash') viewDash();
}
// ===== 뒤로 가기 (아이폰 밀어서 뒤로·안드로이드 뒤로 버튼) =====
// 화면을 옮길 때마다 브라우저 기록을 남겨서, 뒤로 가기가 이전 화면으로 돌아오게 함
let NAV_POP = false;
function pushNav(st, replace){ if(NAV_POP) return; try{ history[replace?'replaceState':'pushState'](st, ''); }catch(_){} }
function goBack(){ if(history.state && history.state.v && history.state.v!=='dash') history.back(); else { S.view='dash'; refresh(true); } }
window.addEventListener('popstate', async e=>{
  if(!S.session || !S.me) return;
  const st = e.state || {v:'dash'}; NAV_POP = true;
  try{
    if(st.v==='detail') await openCust(st.id);
    else if(st.v==='entry') openEntry(st.keep);
    else if(st.v==='paste') openPaste(st.photo, st.keep);
    else if(st.v==='team') await openTeam();
    else if(st.v==='docs') openDocs();
    else { S.view='dash'; await refresh(true); }
  } finally { NAV_POP = false; }
});
// 화면 왼쪽 끝에서 오른쪽으로 밀면 뒤로 가기 (앱이 직접 처리)
//  - 홈 화면에 설치한 앱(아이폰·안드로이드): 브라우저의 밀기 뒤로 가기가 없음
//  - 안드로이드 브라우저: 버튼 3개 내비게이션이면 밀기 뒤로 가기가 없음
//  아이폰 사파리·크롬 탭은 자체 밀기 기능이 있어서 제외. 안드로이드 제스처 내비게이션은 시스템이 터치를 가져가므로(touchcancel) 두 번 뒤로 가지 않음
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const IS_STANDALONE = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
if(IS_STANDALONE || !IS_IOS){
  let sx=null, sy=0, moved=false;
  document.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx = t.clientX<36 ? t.clientX : null; sy=t.clientY; moved=false; }, {passive:true});
  document.addEventListener('touchmove', e=>{ if(sx!=null) moved=true; }, {passive:true});
  document.addEventListener('touchcancel', ()=>{ sx=null; }, {passive:true});
  document.addEventListener('touchend', e=>{ if(sx==null) return; const t=e.changedTouches[0];
    if(moved && t.clientX-sx>70 && Math.abs(t.clientY-sy)<70 && S.view!=='dash' && S.view!=='login') goBack(); sx=null; }, {passive:true});
}
function go(v){
  // 코드에서 첫 화면으로 돌아갈 때는 기록도 한 칸 뒤로 (뒤로 가기가 꼬이지 않게)
  if(v==='dash' && !NAV_POP && history.state && history.state.v && history.state.v!=='dash'){ history.back(); return; }
  S.view=v; if(v==='dash'){ refresh(true); }
}
async function logout(){ await sb.auth.signOut(); }
let START_ID = 0;
async function start(){
  const my = ++START_ID;               // 동시에 여러 번 불려도 마지막 것만 화면에 반영
  const stale = ()=> my !== START_ID;
  const {data:{session}} = await sb.auth.getSession(); if(stale()) return; S.session=session;
  if(!session){ S.view='login'; viewLogin(); return; }
  if(S.setPw){ viewSetPassword(); return; }
  if(session.user?.user_metadata?.must_change_pw){ viewSetPassword(true); return; } // 관리자가 만든·초기화한 계정의 첫 로그인
  app.innerHTML = `<div class="empty">불러오는 중...</div>`;
  // 10초 넘게 멈춰 있으면 다시 불러오기 버튼 표시 (빈 화면 방지)
  setTimeout(()=>{ if(!stale() && S.view!=='dash' && /불러오는 중/.test(app.textContent)){
    app.innerHTML = `<div class="empty">불러오는 데 시간이 오래 걸립니다.<br><br><button class="btn" onclick="location.reload()">다시 불러오기</button></div>`; } }, 10000);
  try{
    await loadMe(); if(stale()) return;
    if(!S.me){ viewName(); return; }
    if(S.ownerFilter==null) S.ownerFilter = S.isAdmin ? S.session.user.id : 'all';
    await loadSummary(); if(stale()) return;
    S.view='dash'; pushNav({v:'dash'}, true); viewDash();
  }catch(e){ if(stale()) return; if(e.inactive){ S.view='login'; return; } /* 로그인 화면은 SIGNED_OUT 처리에서 안내 문구와 함께 표시 */ app.innerHTML = header('회전일 차트') + `<div class="wrap"><div class="card err">${esc(errMsg(e))}</div><button class="btn" onclick="location.reload()">다시 불러오기</button></div>`; }
}
sb.auth.onAuthStateChange((ev, session)=>{
  // 주의: 이 콜백 안에서 Supabase를 바로 다시 부르면 로그인 처리와 서로 기다리며 멈출 수 있음 → 한 박자 뒤에 실행
  if(ev==='PASSWORD_RECOVERY') S.setPw = true;
  if(ev==='SIGNED_IN' && (!S.session || S.session.user.id!==session.user.id)){ S.session=session; setTimeout(start, 0); }
  if(ev==='SIGNED_OUT'){ S.session=null; S.me=null; S.isAdmin=false; S.summary=[]; S.ownerFilter=null; S.view='login'; setTimeout(()=>{ viewLogin(S.loginMsg); S.loginMsg=null; }, 0); }
});
start();
</script>
