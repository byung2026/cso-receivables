<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회전일 차트</title>
<meta name="theme-color" content="#1f3864">
<meta name="color-scheme" content="only light"><!-- 삼성 브라우저 등의 강제 다크모드로 색이 바뀌지 않게 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="회전일 차트">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1b2430; --sub:#5d6b7c; --line:#e3e8ef;
  --brand:#1f3864; --brand2:#2f5597;
  --red:#d93025; --red-bg:#fdecea; --org:#c26100; --org-bg:#fff3e0;
  --grn:#1e8e3e; --grn-bg:#e6f4ea; --gry:#6b7785; --gry-bg:#eef1f4; --ylw-bg:#fff8db;
}
*{box-sizing:border-box}
:root{color-scheme:only light}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%} /* 브라우저 글자 크기 자동 확대로 칸이 깨지지 않게 */
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:10px 16px calc(10px);}
header.top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .who{font-size:13px;opacity:.9;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600;vertical-align:middle}
.b-admin{background:#ffd54f;color:#3b2f00}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand2);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--brand2);border:1px solid #c9d4e5}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:6px 10px;font-size:13px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f1b8b3}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;max-width:100%;min-width:0;padding:11px 12px;border:1px solid #cdd6e1;border-radius:10px;background:#fff}
/* 일자·금액 두 칸: 넓은 화면은 나란히, 휴대폰은 위아래 (아이폰 날짜 칸 겹침 방지) */
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair>div{min-width:0}
@media (max-width:560px){.pair{grid-template-columns:minmax(0,1fr);gap:0}}
/* 아이폰 Safari: 날짜 칸이 옆 칸을 덮지 않게 */
input.i[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left}
input.i[type=date]::-webkit-date-and-time-value{text-align:left}
textarea.i{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.muted{color:var(--sub);font-size:13px}
.err{color:var(--red);font-size:14px;margin-top:8px;white-space:pre-wrap}
.ok{color:var(--grn);font-size:14px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--sub)} .stat .v{font-size:18px;font-weight:700;margin-top:2px}
.stat.red .v{color:var(--red)} .stat.org .v{color:var(--org)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools input,.tools select{flex:1;min-width:140px}
.cust{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--gry);border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer}
.cust.s-block{border-left-color:var(--red)} .cust.s-soon{border-left-color:var(--org)} .cust.s-ok{border-left-color:var(--grn)} .cust.s-hold{border-left-color:#8e6bbf}
.cust .nm{font-weight:700;font-size:16px}
.cust .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--sub)}
.cust .meta b{color:var(--ink)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.c-block{background:var(--red-bg);color:var(--red)} .c-soon{background:var(--org-bg);color:var(--org)}
.c-ok{background:var(--grn-bg);color:var(--grn)} .c-none{background:var(--gry-bg);color:var(--gry)} .c-hold{background:#f1e9fb;color:#6a3fa0}
.c-warn{background:var(--ylw-bg);color:#7a5a00}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--sub);font-weight:600;font-size:12.5px;background:#fafbfc;white-space:nowrap}
table.t td{white-space:nowrap} table.t td.it{white-space:normal;min-width:90px;word-break:keep-all}
@media (max-width:440px){table.t th,table.t td{padding:7px 4px;font-size:12.5px} table.t td.it{min-width:70px}}
.ent{border-bottom:1px solid var(--line);padding:10px 2px}
.ent:last-child{border-bottom:0}
.ent.pend{background:var(--ylw-bg)} .ent.bad{background:var(--red-bg)}
.ent .l1{display:flex;gap:8px;align-items:baseline}
.ent .dt{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;white-space:nowrap}
.ent .kd{font-weight:700;font-size:13px;white-space:nowrap}
.ent .it{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.ent .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ent .amt.s{color:var(--ink)} .ent .amt.p{color:var(--brand2)}
.ent .l2{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.ent .l2 .sp{flex:1}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.pend td{background:var(--ylw-bg)} tr.bad td{background:var(--red-bg)}
.buckets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bk{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bk .k{font-size:12px;color:var(--sub)} .bk .v{font-weight:700;font-variant-numeric:tabular-nums}
.bk.hot{border-color:#f1b8b3;background:var(--red-bg)}
@media (max-width:620px){.buckets{grid-template-columns:repeat(2,1fr)}}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20}
.fab .btn{box-shadow:0 6px 18px rgba(31,56,100,.25)}
.back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px 0 0;cursor:pointer}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login h2{margin:0 0 4px;font-size:22px}
h3{font-size:15px;margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv div:nth-child(odd){color:var(--sub)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.seg{display:flex;border:1px solid #cdd6e1;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 0;cursor:pointer}
.seg button.on{background:var(--brand2);color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== 설정 =====
const SUPABASE_URL = 'https://paeumfhredezpwyrirjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1f_ucdTBzhtwTnYxXUO1Gg_6lX7zNZf'; // 공개용 키 (데이터는 로그인·DB 권한으로 보호)
const SOON_DAYS = 30; // 마지막 주문 가능일까지 이 일수 이내면 '곧 차단'

const AUTH_TYPE = (location.hash.match(/type=([a-z]+)/) || [])[1] || null; // invite / recovery
// 로그인 편의 설정 (이 기기에만 저장)
const PREF = {
  get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set(k,v){ try{ v==null? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(_){} }
};
const autoLogin = ()=> PREF.get('cso_auto') !== '0';   // 기본: 자동 로그인 켜짐
// 자동 로그인 켜짐 → 로그인 유지(localStorage) / 꺼짐 → 브라우저를 닫으면 로그아웃(sessionStorage)
const authStorage = {
  getItem(k){ try{ return (autoLogin()?localStorage:sessionStorage).getItem(k); }catch(_){ return null; } },
  setItem(k,v){ try{ (autoLogin()?localStorage:sessionStorage).setItem(k,v); (autoLogin()?sessionStorage:localStorage).removeItem(k); }catch(_){} },
  removeItem(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(_){} }
};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'receivables' }, auth: { storage: authStorage, persistSession: true } });

// ===== 상태 =====
const S = {
  session: null, isAdmin: false, me: null, members: [],
  base: todayStr(), summary: [], ownerFilter: 'all', q: '',
  view: 'loading', custId: null, entryCustName: '', setPw: AUTH_TYPE === 'invite' || AUTH_TYPE === 'recovery'
};

// ===== 유틸 =====
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function won(n){ return (Number(n)||0).toLocaleString('ko-KR'); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dd(a,b){ return Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00'))/86400000); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function blockDays(){ const c=S.summary.find(x=>x.oldest_date && x.block_start_date); return c? dd(c.block_start_date, c.oldest_date) : 181; }
function md(s){ return s ? s.slice(2).replaceAll('-','.') : '-'; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function errMsg(e){ const m=(e && (e.message||e.error_description||e.msg)) || String(e);
  if(/schema must be one of|PGRST106/.test(m)) return '서버 설정 확인 필요: Data API의 Exposed schemas에 receivables가 없습니다.';
  if(/Invalid login/.test(m)) return '이메일 또는 비밀번호가 맞지 않습니다.';
  if(/row-level security|42501|permission denied/.test(m)) return '권한이 없습니다. (본인 거래처만 입력·수정할 수 있습니다)';
  return m; }
const app = document.getElementById('app');

function status(c){
  if(Number(c.balance)===0) return {k:'none', t:'미수금 없음', cls:'c-none'};
  if(Number(c.over_block)>0) return {k:'block', t:'주문 차단', cls:'c-block'};
  if(Number(c.undated_remaining)>0) return {k:'hold', t:'판정 보류', cls:'c-hold'};
  if(c.last_order_date && dd(c.last_order_date, S.base) <= SOON_DAYS) return {k:'soon', t:'곧 차단', cls:'c-soon'};
  return {k:'ok', t:'주문 가능', cls:'c-ok'};
}
const ORDER = {block:0, soon:1, hold:2, ok:3, none:4};

// ===== 데이터 =====
async function loadMe(){
  const uid = S.session.user.id;
  const [{data:adm}, {data:me}] = await Promise.all([
    sb.schema('public').rpc('is_admin'),
    sb.from('members').select('*').eq('user_id', uid).maybeSingle()
  ]);
  S.isAdmin = adm === true; S.me = me || null;
  if(S.isAdmin){ const {data} = await sb.from('members').select('*').order('display_name'); S.members = data || []; }
}
async function loadSummary(){
  const {data, error} = await sb.rpc('customer_summary', {p_base: S.base});
  if(error) throw error;
  S.summary = (data||[]).map(c=>({...c, _s: status(c)}))
    .sort((a,b)=> ORDER[a._s.k]-ORDER[b._s.k] || (b.turnover_days??-1)-(a.turnover_days??-1) || a.customer_name.localeCompare(b.customer_name,'ko'));
}

// ===== 화면: 공통 헤더 =====
function header(title, back){
  const name = S.me ? esc(S.me.display_name) : '';
  return `<header class="top"><div class="in">
    ${back?`<button class="back" onclick="go('dash')" aria-label="뒤로">‹</button>`:''}
    <h1>${esc(title)}</h1>
    <span class="who">${name} ${S.isAdmin?'<span class="badge b-admin">관리자</span>':''}</span>
    ${back?'':`<button class="btn ghost" onclick="logout()">로그아웃</button>`}
  </div></header>`;
}

// ===== 로그인 =====
function viewLogin(msg){
  app.innerHTML = `<div class="login">
    <h2>회전일 차트</h2><div class="muted">초대받은 이메일로 로그인하세요.</div>
    <form id="lf" class="card">
      <label class="f">이메일</label><input class="i" id="em" type="email" autocomplete="username" required value="${esc(PREF.get('cso_email')||'')}">
      <label class="f">비밀번호</label><input class="i" id="pw" type="password" autocomplete="current-password" required>
      <div class="row" style="margin-top:12px;gap:18px">
        <label class="row" style="gap:6px;cursor:pointer"><input type="checkbox" id="saveId" ${PREF.get('cso_email')?'checked':''} style="width:18px;height:18px">아이디 저장</label>
        <label class="row" style="gap:6px;cursor:pointer"><input type="checkbox" id="autoLg" ${autoLogin()?'checked':''} style="width:18px;height:18px">자동 로그인</label>
      </div>
      <div style="margin-top:14px"><button class="btn" style="width:100%">로그인</button></div>
      <div id="lm" class="err">${msg?esc(msg):''}</div>
      <div style="margin-top:10px;text-align:right"><a href="#" id="fp" class="muted">비밀번호를 잊으셨나요?</a></div>
    </form></div>`;
  document.getElementById('lf').onsubmit = async e=>{
    e.preventDefault(); const lm=document.getElementById('lm'); lm.textContent='로그인 중...';
    PREF.set('cso_auto', autoLg.checked ? '1' : '0');
    PREF.set('cso_email', saveId.checked ? em.value.trim() : null);
    const {error} = await sb.auth.signInWithPassword({email:em.value.trim(), password:pw.value});
    if(error) lm.textContent = errMsg(error);
  };
  document.getElementById('fp').onclick = async e=>{
    e.preventDefault(); const lm=document.getElementById('lm'); const email=em.value.trim();
    if(!email){ lm.textContent='이메일을 먼저 입력하세요.'; return; }
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin+location.pathname});
    lm.className = error?'err':'ok'; lm.textContent = error? errMsg(error) : '비밀번호 재설정 메일을 보냈습니다.';
  };
}
function viewSetPassword(){
  app.innerHTML = `<div class="login"><h2>비밀번호 설정</h2>
    <div class="muted">앞으로 로그인할 때 쓸 비밀번호를 정하세요. (8자 이상)</div>
    <form id="sf" class="card">
      <label class="f">새 비밀번호</label><input class="i" id="p1" type="password" minlength="8" autocomplete="new-password" required>
      <label class="f">한 번 더</label><input class="i" id="p2" type="password" minlength="8" autocomplete="new-password" required>
      <div style="margin-top:14px"><button class="btn" style="width:100%">저장</button></div><div id="sm" class="err"></div>
    </form></div>`;
  document.getElementById('sf').onsubmit = async e=>{
    e.preventDefault(); const sm=document.getElementById('sm');
    if(p1.value!==p2.value){ sm.textContent='두 비밀번호가 다릅니다.'; return; }
    const {error} = await sb.auth.updateUser({password:p1.value});
    if(error){ sm.textContent=errMsg(error); return; }
    S.setPw=false; history.replaceState(null,'',location.pathname); toast('비밀번호를 저장했습니다.'); start();
  };
}
function viewName(){
  app.innerHTML = `<div class="login"><h2>이름 등록</h2><div class="muted">회전일 차트에 표시될 이름입니다. (예: 홍길동)</div>
    <form id="nf" class="card"><label class="f">이름</label><input class="i" id="nm" required maxlength="20">
    <div style="margin-top:14px"><button class="btn" style="width:100%">시작하기</button></div><div id="nmm" class="err"></div></form></div>`;
  document.getElementById('nf').onsubmit = async e=>{
    e.preventDefault();
    const {error} = await sb.from('members').insert({user_id:S.session.user.id, display_name:nm.value.trim()});
    if(error){ document.getElementById('nmm').textContent=errMsg(error); return; }
    start();
  };
}

// ===== 현황판 =====
function viewDash(){
  const list = S.summary.filter(c=>
    (S.ownerFilter==='all' || c.owner_id===S.ownerFilter) &&
    (!S.q || c.customer_name.includes(S.q)));
  const sum = (f)=> list.reduce((a,c)=>a+Number(f(c)||0),0);
  const cnt = (k)=> list.filter(c=>c._s.k===k).length;
  const owners = [...new Map(S.summary.map(c=>[c.owner_id, c.owner_name||'(이름 없음)'])).entries()];
  app.innerHTML = header('회전일 차트') + `<div class="wrap">
    <div class="tools">
      <label class="muted" style="align-self:center">기준일</label>
      <input class="i" type="date" id="base" value="${S.base}" style="max-width:170px">
      ${S.isAdmin?`<select class="i" id="own"><option value="all">전체 담당자</option>${owners.map(([id,n])=>`<option value="${id}" ${S.ownerFilter===id?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}
      <input class="i" id="q" placeholder="거래처 검색" value="${esc(S.q)}">
      ${S.isAdmin?`<button class="btn sec" style="flex:0 0 auto" onclick="openTeam()">👥 동료 관리</button>`:''}
    </div>
    <div class="stats">
      <div class="stat"><div class="k">총 미수금</div><div class="v">${won(sum(c=>c.balance))}</div></div>
      <div class="stat red"><div class="k">주문 차단</div><div class="v">${cnt('block')}곳</div></div>
      <div class="stat org"><div class="k">곧 차단 (${SOON_DAYS}일 내)</div><div class="v">${cnt('soon')}곳</div></div>
      <div class="stat red"><div class="k">181일 이상 금액</div><div class="v">${won(sum(c=>c.over_block))}</div></div>
    </div>
    ${list.length? list.map(c=>{
      const s=c._s; const left = c.last_order_date? dd(c.last_order_date,S.base):null;
      return `<button class="cust s-${s.k}" onclick="openCust('${c.customer_id}')">
        <div class="row"><span class="nm grow">${esc(c.customer_name)}</span><span class="chip ${s.cls}">${s.t}</span></div>
        <div class="meta">
          ${S.isAdmin?`<span>담당 <b>${esc(c.owner_name||'-')}</b></span>`:''}
          <span>잔액 <b>${won(c.balance)}</b></span>

function runCheck(entries){
  let rb=0; return entries.map(e=>{
    const counted = e.status==='확정';
    if(counted) rb += Number(e.sale_amount) - Number(e.pay_amount);
    const mism = counted && e.ledger_balance!=null && Number(e.ledger_balance)!==rb;
    return {...e, _rb: counted? rb : null, _mis: mism};
  });
}

  return Number(a.seq)-Number(b.seq); }

// ===== 붙여넣기 (엑셀·거래장 여러 줄) =====
function openPaste(photo){ S.view='paste'; S.photoMode=!!photo; S.photoIds=[]; viewPaste(); }
// 사진 축소 (긴 변 2400px, JPEG) → 업로드 용량·읽기 비용 절감
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>no(new Error('사진을 열 수 없습니다. (JPG/PNG로 다시 시도)')); i.src=url;});
    const k=Math.min(1, 2400/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.88));
  } finally { URL.revokeObjectURL(url); }
}
async function readPhotos(files, onStatus){
  const uid=S.session.user.id; const all=[]; let name='';
  for(let n=0;n<files.length;n++){
    onStatus(`${n+1}/${files.length}장 올리는 중...`);
    const blob=await shrink(files[n]);
    const path=`${uid}/${Date.now()}-${n}.jpg`;
    const up=await sb.storage.from('ledger-photos').upload(path, blob, {contentType:'image/jpeg'}); if(up.error) throw up.error;
    const ph=await sb.from('photos').insert({storage_path:path}).select('id').single(); if(ph.error) throw ph.error;
    S.photoIds.push(ph.data.id);
    onStatus(`${n+1}/${files.length}장 읽는 중... (10~30초)`);
    const {data, error}=await sb.functions.invoke('read-ledger',{body:{photo_id:ph.data.id}});
    if(error){ let m=error.message; try{ const b=await error.context.json(); m=b.message||m; }catch(_){} throw new Error(m); }
    if(!name && data.customer_name) name=data.customer_name;
    all.push(...data.rows.map(r=>({...r, _photo:n, _model:data.model})));
  }
  // 겹쳐 찍은 사진의 같은 줄(날짜·구분·금액·잔액 동일)은 중복 의심으로 표시
  const seen=new Set();
  const lines=all.map(r=>{ const key=[r.date,r.kind,r.amount,r.balance].join('|');
    const dup = r.balance!=null && seen.has(key) && all.find(x=>[x.date,x.kind,x.amount,x.balance].join('|')===key)._photo!==r._photo;
    seen.add(key);
    return (dup?'#':r.unclear?'?':'')+[r.date||'', r.kind, r.amount, r.item||'', r.balance??''].join('\t'); });
  return {name, text: lines.join('\n'), models:[...new Set(all.map(r=>r._model))]};
}
const KIND_MAP = {'판매':'판매','매출':'판매','출고':'판매','수금':'수금','입금':'수금','이월':'이월','전기이월':'이월','전월이월':'이월','반품':'반품'};
function parseDate(s){ s=(s||'').trim(); if(!s) return null; const m=s.replace(/[./년월]/g,'-').replace(/일/,'').match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})/);
  if(!m) return undefined; let y=Number(m[1]); if(y<100) y+=2000; return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`; }
function num(s){ const v=String(s||'').replace(/[^0-9-]/g,''); return v===''||v==='-'?null:Number(v); }
function parsePaste(txt){
  return txt.split(/\r?\n/).map(l=>l.replace(/^[ ]+|[ ]+$/g,'')).filter(Boolean).map((l,i)=>{
    const flag = l[0]==='#'?'dup': l[0]==='?'?'unc':''; if(flag) l=l.slice(1).trim();
    const c = l.includes('\t')? l.split('\t') : l.split(/,(?![0-9]{3})/);
    const kindRaw=(c[1]||'').trim(); let kind=KIND_MAP[kindRaw.replace(/\s/g,'')];
    const date=parseDate(c[0]); let amt=num(c[2]);
    if(amt!=null && amt<0){ if(kind==='판매') kind='반품'; amt=Math.abs(amt); } // 거래장의 마이너스 판매 = 반품
    const r={line:i+1, date, kind, amt, item:(c[3]||'').trim()||null, lb:num(c[4]), err:''};
    if(!kind) r.err='구분을 모름(판매/수금/이월/반품)'; else if(date===undefined) r.err='날짜 형식 오류'; else if(!date && kind!=='이월') r.err='날짜 없음';
    else if(!amt) r.err='금액 없음';
    if(!r.err && flag==='dup') r.err='중복 의심(앞 사진과 같은 줄) – 저장하려면 맨 앞 # 지우기';
    if(!r.err && flag==='unc') r.err='사진 글자 불명확 – 확인 후 맨 앞 ? 지우기';
    return r; });
}
function viewPaste(){
  app.innerHTML = header(S.photoMode?'사진으로 입력':'여러 줄 붙여넣기', true) + `<div class="wrap"><div class="card">
    <label class="f">거래처</label><input class="i" id="pc" list="cl2" value="${esc(S.entryCustName)}" placeholder="병원이름"><datalist id="cl2">${custOptions()}</datalist>
    <label class="f">거래장 사진 (여러 장 가능 · 위에서부터 순서대로 찍은 순서로 선택)</label>
    <label class="btn ${S.photoMode?'':'sec'}" style="display:block;text-align:center">📷 사진 선택해서 읽기<input type="file" id="pf" accept="image/*" multiple hidden></label>
    <div id="pst" class="muted" style="margin-top:6px"></div>
    <label class="f">거래 내역 (사진 읽은 결과 또는 엑셀 붙여넣기 · 고칠 곳은 여기서 직접 수정) · 순서: 일자 / 구분 / 금액 / 품목 / 거래장잔액</label>
    <textarea class="i" id="pt" placeholder="2026-05-13	판매	4503900	하이알포르테주	16657450&#10;2026-05-27	수금	2800000		13857450"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn sec" id="pv">미리보기</button><button class="btn" id="ps" disabled>모두 저장</button></div>
    <div id="pr" style="margin-top:12px"></div></div></div>`;
  let rows=[];
  pv.onclick = async ()=>{
    rows = parsePaste(pt.value);
    let start = 0; const name=pc.value.trim(); const ex = S.summary.find(c=>c.customer_name===name && c.owner_id===S.session.user.id);
    if(ex){ const {data}=await sb.from('entries').select('*').eq('customer_id',ex.customer_id); const r=runCheck((data||[]).sort(sortEntries)).reverse().find(x=>x._rb!=null); start=r?r._rb:0; }
    let rb=start, bad=0;
    rows.forEach(r=>{ if(r.err){bad++;return;} rb += (r.kind==='수금'||r.kind==='반품')? -r.amt : r.amt; r.rb=rb; r.mis = r.lb!=null && r.lb!==rb; if(r.mis) bad++; });
    pr.innerHTML = `${ex?`<div class="muted">기존 잔액 ${won(start)}원에 이어서 계산합니다.</div>`:''}
      <div class="scroll"><table class="t"><tr><th>#</th><th>일자</th><th>구분</th><th class="n">금액</th><th>품목</th><th class="n">계산 잔액</th><th class="n">거래장</th><th>확인</th></tr>
      ${rows.map(r=>`<tr class="${r.err||r.mis?'bad':''}"><td>${r.line}</td><td>${r.date||'-'}</td><td>${r.kind||'?'}</td><td class="n">${won(r.amt)}</td><td>${esc(r.item||'')}</td>
        <td class="n">${r.rb!=null?won(r.rb):''}</td><td class="n">${r.lb!=null?won(r.lb):''}</td><td>${r.err?esc(r.err):r.mis?'불일치 ⚠':'✓'}</td></tr>`).join('')}</table></div>
      <div class="${bad?'err':'ok'}">${rows.length}줄 중 ${bad?`${bad}줄 확인 필요 (오류 줄은 저장되지 않음, 불일치 줄은 '확인대기'로 저장)`:'모두 정상'}</div>`;
    ps.disabled = !name || !rows.some(r=>!r.err);
  };
  pf.onchange = async ()=>{
    const files=[...pf.files]; if(!files.length) return; pf.value='';
    const st=document.getElementById('pst'); st.className='muted';
    try{
      const r=await readPhotos(files, m=>st.textContent=m);
      if(!pc.value.trim() && r.name) pc.value=r.name;
      pt.value = (pt.value.trim()? pt.value.trim()+'\n' : '') + r.text;
      S.photoMode=true;
      st.className='ok'; st.textContent=`${files.length}장 읽기 완료 (${r.models.map(m=>m==='sonnet'?'정밀 재확인':'빠른 읽기').join(', ')}). 아래 미리보기에서 빨간 줄을 사진과 대조하세요.`;
      pv.click();
    }catch(e){ st.className='err'; st.textContent='사진 읽기 실패: '+errMsg(e); }
  };
  ps.onclick = async ()=>{
    ps.disabled=true; const name=pc.value.trim();
    try{
      const cid = await customerIdFor(name);
      const ins = rows.filter(r=>!r.err).map(r=>({customer_id:cid, kind:r.kind, entry_date:r.date, item: r.item,
        sale_amount: (r.kind==='판매'||r.kind==='이월')?r.amt:0, pay_amount: (r.kind==='수금'||r.kind==='반품')?r.amt:0, ledger_balance:r.lb,
        input_method: S.photoMode?'사진':'엑셀', photo_id: S.photoIds[0]||null, status: r.mis?'확인대기':'확정'}));
      for(const row of ins){ const {error}=await sb.from('entries').insert(row); if(error) throw error; } // 한 줄씩 넣어 순서 보존
      if(S.photoIds.length) await sb.from('photos').update({status:'확인완료', customer_id:cid}).in('id', S.photoIds);
      S.entryCustName=name; await refresh(false); toast(`${ins.length}줄 저장했습니다.`);
      const c=S.summary.find(x=>x.customer_id===cid); if(c){ openCust(cid); } else go('dash');
    }catch(er){ pr.insertAdjacentHTML('beforeend', `<div class="err">${esc(errMsg(er))}</div>`); ps.disabled=false; }
  };
}

// ===== 동료 관리 (관리자) =====
async function openTeam(){ S.view='team'; await viewTeam(); }
async function viewTeam(msg, ok){
  if(!S.isAdmin){ go('dash'); return; }
  const {data} = await sb.from('members').select('*').order('created_at'); S.members = data||[];
  const cnt = id => S.summary.filter(c=>c.owner_id===id).length;
  app.innerHTML = header('동료 관리', true) + `<div class="wrap">
    <form id="inv" class="card"><h3>동료 초대</h3>
      <div class="muted">초대 메일의 링크를 누르면 회전일 차트로 바로 들어와 비밀번호만 정하면 됩니다.</div>
      <label class="f">이름 (회전일 차트에 표시)</label><input class="i" id="iname" required maxlength="20" placeholder="홍길동">
      <label class="f">이메일</label><input class="i" id="iemail" type="email" required placeholder="name@example.com">
      <div style="margin-top:14px"><button class="btn" style="width:100%" id="ibtn">초대 메일 보내기</button></div>
      <div id="imsg" class="${ok?'ok':'err'}">${msg?esc(msg):''}</div>
    </form>
    <div class="card"><h3>등록된 담당자 (${S.members.length}명)</h3>
      <div class="scroll"><table class="t"><tr><th>이름</th><th class="n">거래처</th><th>등록일</th></tr>
      ${S.members.map(m=>`<tr><td>${esc(m.display_name)}${m.user_id===S.session.user.id?' <span class="badge b-admin">관리자</span>':''}</td>
        <td class="n">${cnt(m.user_id)}곳</td><td>${md((m.created_at||'').slice(0,10))}</td></tr>`).join('')}</table></div>
      <div class="muted" style="margin-top:8px">초대한 동료가 아직 비밀번호를 정하지 않았어도 여기에 나옵니다. 메일이 안 왔다면 스팸함을 확인하게 하세요.</div>
    </div></div>`;
  inv.onsubmit = async e=>{
    e.preventDefault(); ibtn.disabled=true; const out=document.getElementById('imsg'); out.className='muted'; out.textContent='보내는 중...';
    const {data, error} = await sb.functions.invoke('invite-member', {body:{email:iemail.value.trim(), name:iname.value.trim()}});
    if(error){ let m=error.message; try{ const b=await error.context.json(); m=b.message||m; }catch(_){} ibtn.disabled=false; out.className='err'; out.textContent=m; return; }
    await viewTeam(`${data.name}(${data.email})님에게 초대 메일을 보냈습니다.`, true);
  };
}

// ===== 흐름 =====
async function refresh(rerender=true){
  try{ await loadSummary(); }catch(e){ toast(errMsg(e)); }
  if(!rerender) return;
  if(S.view==='detail') await viewDetail(); else if(S.view==='dash') viewDash();
}
function go(v){ S.view=v; if(v==='dash'){ refresh(true); } }
async function logout(){ await sb.auth.signOut(); }
async function start(){
  const {data:{session}} = await sb.auth.getSession(); S.session=session;
  if(!session){ S.view='login'; viewLogin(); return; }
  if(S.setPw){ viewSetPassword(); return; }
  app.innerHTML = `<div class="empty">불러오는 중...</div>`;
  try{
    await loadMe();
    if(!S.me){ viewName(); return; }
    await loadSummary(); S.view='dash'; viewDash();
  }catch(e){ app.innerHTML = header('회전일 차트') + `<div class="wrap"><div class="card err">${esc(errMsg(e))}</div></div>`; }
}
sb.auth.onAuthStateChange((ev, session)=>{
  if(ev==='PASSWORD_RECOVERY') S.setPw = true;
  if(ev==='SIGNED_IN' && (!S.session || S.session.user.id!==session.user.id)){ S.session=session; start(); }
  if(ev==='SIGNED_OUT'){ S.session=null; S.me=null; S.isAdmin=false; S.summary=[]; S.view='login'; viewLogin(); }
});
start();
</script>
