<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회전일 차트</title>
<meta name="theme-color" content="#1f3864">
<meta name="color-scheme" content="only light"><!-- 삼성 브라우저 등의 강제 다크모드로 색이 바뀌지 않게 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1b2430; --sub:#5d6b7c; --line:#e3e8ef;
  --brand:#1f3864; --brand2:#2f5597;
  --red:#d93025; --red-bg:#fdecea; --org:#c26100; --org-bg:#fff3e0;
  --grn:#1e8e3e; --grn-bg:#e6f4ea; --gry:#6b7785; --gry-bg:#eef1f4; --ylw-bg:#fff8db;
}
*{box-sizing:border-box}
:root{color-scheme:only light}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%} /* 브라우저 글자 크기 자동 확대로 칸이 깨지지 않게 */
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:10px 16px calc(10px);}
header.top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .who{font-size:13px;opacity:.9;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600;vertical-align:middle}
.b-admin{background:#ffd54f;color:#3b2f00}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand2);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--brand2);border:1px solid #c9d4e5}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);padding:6px 10px;font-size:13px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f1b8b3}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
/* 아이폰 사파리: 입력칸 글자가 16px보다 작으면 누를 때 화면을 자동 확대함 → 16px로 고정 */
input,select,textarea{font-size:16px}
input.i,select.i,textarea.i{font-size:16px;width:100%;max-width:100%;min-width:0;padding:11px 12px;border:1px solid #cdd6e1;border-radius:10px;background:#fff}
/* 일자·금액 두 칸: 넓은 화면은 나란히, 휴대폰은 위아래 (아이폰 날짜 칸 겹침 방지) */
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair>div{min-width:0}
@media (max-width:560px){.pair{grid-template-columns:minmax(0,1fr);gap:0}}
/* 아이폰 Safari: 날짜 칸이 옆 칸을 덮지 않게 */
input.i[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left}
input.i[type=date]::-webkit-date-and-time-value{text-align:left}
textarea.i{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:16px}
.muted{color:var(--sub);font-size:13px}
.err{color:var(--red);font-size:14px;margin-top:8px;white-space:pre-wrap}
.ok{color:var(--grn);font-size:14px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--sub)} .stat .v{font-size:18px;font-weight:700;margin-top:2px}
.stat.red .v{color:var(--red)} .stat.org .v{color:var(--org)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools input,.tools select{flex:1;min-width:140px}
.cust{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--gry);border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer}
.cust.s-block{border-left-color:var(--red)} .cust.s-soon{border-left-color:var(--org)} .cust.s-ok{border-left-color:var(--grn)} .cust.s-hold{border-left-color:#8e6bbf}
.cust .nm{font-weight:700;font-size:16px}
.cust .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--sub)}
.cust .meta b{color:var(--ink)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.c-block{background:var(--red-bg);color:var(--red)} .c-soon{background:var(--org-bg);color:var(--org)}
.c-ok{background:var(--grn-bg);color:var(--grn)} .c-none{background:var(--gry-bg);color:var(--gry)} .c-hold{background:#f1e9fb;color:#6a3fa0}
.c-warn{background:var(--ylw-bg);color:#7a5a00}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--sub);font-weight:600;font-size:12.5px;background:#fafbfc;white-space:nowrap}
table.t td{white-space:nowrap} table.t td.it{white-space:normal;min-width:90px;word-break:keep-all}
@media (max-width:440px){table.t th,table.t td{padding:7px 4px;font-size:12.5px} table.t td.it{min-width:70px}}
.ent{border-bottom:1px solid var(--line);padding:10px 2px}
.ent:last-child{border-bottom:0}
.ent.pend{background:var(--ylw-bg)} .ent.bad{background:var(--red-bg)}
.ent .l1{display:flex;gap:8px;align-items:baseline}
.ent .dt{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;white-space:nowrap}
.ent .kd{font-weight:700;font-size:13px;white-space:nowrap}
.ent .it{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.ent .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ent .amt.s{color:var(--ink)} .ent .amt.p{color:var(--brand2)}
.ent .l2{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.ent .l2 .sp{flex:1}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 주문발생 표: 가로 스크롤 없이 품목만 줄바꿈 (fixed 레이아웃 + break-word → iOS Safari·Android Chrome 공통) */
table.t.ord{table-layout:fixed}
table.t.team{width:100%} table.t.team td{white-space:normal;vertical-align:middle} table.t.team td.n{white-space:nowrap}
table.t.ord td.it{white-space:normal;min-width:0;word-break:keep-all;overflow-wrap:break-word;word-wrap:break-word}
table.t.ord col.c-d{width:66px} table.t.ord col.c-r{width:86px} table.t.ord col.c-a{width:44px} table.t.ord col.c-m{width:66px}
@media (max-width:440px){table.t.ord col.c-d{width:60px} table.t.ord col.c-r{width:76px} table.t.ord col.c-a{width:40px} table.t.ord col.c-m{width:58px}}
@media (max-width:380px){table.t.ord th,table.t.ord td{padding:7px 3px;font-size:12px} table.t.ord col.c-d{width:54px} table.t.ord col.c-r{width:74px} table.t.ord col.c-a{width:36px} table.t.ord col.c-m{width:52px}}
tr.pend td{background:var(--ylw-bg)} tr.bad td{background:var(--red-bg)}
.buckets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bk{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bk .k{font-size:12px;color:var(--sub)} .bk .v{font-weight:700;font-variant-numeric:tabular-nums}
.bk.hot{border-color:#f1b8b3;background:var(--red-bg)}
.more{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:8px 0;border:0;background:none;color:var(--sub);font-size:14px;cursor:pointer}
.more::before,.more::after{content:"";flex:1;border-top:1px solid var(--line)}
.bk.tap{cursor:pointer} .bk.tap:active{transform:scale(.98)} .bk.sel{border:2px solid var(--navy,#1e3a6e);padding:7px 9px;background:#eef3fb}
button.bk{display:block;width:100%;text-align:left;background:#fff;font:inherit;color:inherit;cursor:pointer}
button.bk.hot{background:var(--red-bg)}
button.bk:disabled{cursor:default;opacity:.55}
button.bk.sel{border:2px solid var(--brand2);box-shadow:0 0 0 2px rgba(47,85,151,.15)}
.bk .n{font-size:12px;color:var(--sub);margin-top:2px}
@media (max-width:620px){.buckets{grid-template-columns:repeat(2,1fr)}}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20}
.fab .btn{box-shadow:0 6px 18px rgba(31,56,100,.25)}
.back{background:none;border:0;color:#fff;font-size:22px;padding:0 6px 0 0;cursor:pointer}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login h2{margin:0 0 4px;font-size:22px}
h3{font-size:15px;margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv div:nth-child(odd){color:var(--sub)}
.mrow{background:#fff;border:1px solid var(--line);border-left:5px solid #cdd6e1;border-radius:12px;padding:10px 12px;margin:10px 0}
.mrow.ok{border-left-color:var(--grn)} .mrow.mis{border-left-color:var(--org);background:#fffaf2} .mrow.err{border-left-color:var(--red);background:var(--red-bg)} .mrow.skip{opacity:.55} .mrow.zero{border-left-color:#9aa3af} .mrow.zero .mst{color:var(--sub)}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mskip{display:flex;align-items:center;gap:6px;font-size:13px}
.mdel{border:0;background:none;font-size:18px;cursor:pointer;padding:2px 4px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}
.mgrid label{font-size:12.5px;color:var(--sub);display:block;min-width:0}
.mgrid label .i{margin-top:3px;padding:9px 10px}
.mgrid .span2{grid-column:1/-1}
.mst{font-size:13px;margin-top:6px;color:var(--sub)} .mrow.mis .mst{color:var(--org);font-weight:600} .mrow.err .mst{color:var(--red);font-weight:600} .mrow.ok .mst{color:var(--grn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#1b2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.seg{display:flex;border:1px solid #cdd6e1;border-radius:10px;overflow:hidden}
.seg button{flex:1 1 auto;border:0;background:#fff;padding:10px 6px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--brand2);color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== 설정 =====
const SUPABASE_URL = 'https://paeumfhredezpwyrirjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1f_ucdTBzhtwTnYxXUO1Gg_6lX7zNZf'; // 공개용 키 (데이터는 로그인·DB 권한으로 보호)
const SOON_DAYS = 30; // 마지막 주문 가능일까지 이 일수 이내면 '곧 차단'

const AUTH_TYPE = (location.hash.match(/type=([a-z]+)/) || [])[1] || null; // invite / recovery
// 로그인 편의 설정 (이 기기에만 저장)
const PREF = {
  get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set(k,v){ try{ v==null? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(_){} }
};
const autoLogin = ()=> PREF.get('cso_auto') === '1';   // 기본: 자동 로그인 꺼짐 (체크했을 때만 유지)
const saveIdOn = ()=> PREF.get('cso_saveid') !== '0';   // 기본: 아이디 저장 켜짐
// 자동 로그인 켜짐 → 로그인 유지(localStorage) / 꺼짐 → 브라우저를 닫으면 로그아웃(sessionStorage)
const authStorage = {
  getItem(k){ try{ return (autoLogin()?localStorage:sessionStorage).getItem(k); }catch(_){ return null; } },
  setItem(k,v){ try{ (autoLogin()?localStorage:sessionStorage).setItem(k,v); (autoLogin()?sessionStorage:localStorage).removeItem(k); }catch(_){} },
  removeItem(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(_){} }
};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'receivables' }, auth: { storage: authStorage, persistSession: true } });

// ===== 상태 =====
const S = {
  session: null, isAdmin: false, me: null, members: [],
  base: todayStr(), summary: [], ownerFilter: null, q: '',   // null = 로그인 직후 기본값(관리자는 본인 거래처부터)
  view: 'loading', custId: null, entryCustName: '', setPw: AUTH_TYPE === 'invite' || AUTH_TYPE === 'recovery'
};

// ===== 유틸 =====
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function won(n){ return (Number(n)||0).toLocaleString('ko-KR'); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dd(a,b){ return Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00'))/86400000); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function blockDays(){ const c=S.summary.find(x=>x.oldest_date && x.block_start_date); return c? dd(c.block_start_date, c.oldest_date) : 181; }
function md(s){ return s ? s.slice(2).replaceAll('-','.') : '-'; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function errMsg(e){ const m=(e && (e.message||e.error_description||e.msg)) || String(e);
  if(/schema must be one of|PGRST106/.test(m)) return '서버 설정 확인 필요: Data API의 Exposed schemas에 receivables가 없습니다.';
  if(/banned/i.test(m)) return '사용 중지된 계정입니다. 관리자에게 문의하세요.';
  if(/Invalid login/.test(m)) return '아이디(이메일) 또는 비밀번호가 맞지 않습니다.';
  if(/same_password|should be different/i.test(m)) return '임시 비밀번호와 다른 비밀번호로 정하세요.';
  if(/row-level security|42501|permission denied/.test(m)) return '권한이 없습니다. (본인 거래처만 입력·수정할 수 있습니다)';
  return m; }
const app = document.getElementById('app');
// 관리자가 만든 아이디 계정은 내부적으로 '아이디@cso-chart.invalid'로 저장 (메일은 가지 않음)
const ID_DOMAIN = 'cso-chart.invalid';
const APP_URL = 'https://byung2026.github.io/cso-receivables/';
const toLoginEmail = v => { v=(v||'').trim(); return v.includes('@') ? v : `${v.toLowerCase()}@${ID_DOMAIN}`; };
const shownId = v => (v||'').endsWith('@'+ID_DOMAIN) ? v.slice(0, -(ID_DOMAIN.length+1)) : (v||'');

function status(c){
  if(Number(c.balance)===0) return {k:'none', t:'미수금 없음', cls:'c-none'};
  if(Number(c.over_block)>0) return {k:'block', t:'주문 차단', cls:'c-block'};
  if(Number(c.undated_remaining)>0) return {k:'hold', t:'판정 보류', cls:'c-hold'};
  if(c.last_order_date && dd(c.last_order_date, S.base) <= SOON_DAYS) return {k:'soon', t:'곧 차단', cls:'c-soon'};
  return {k:'ok', t:'주문 가능', cls:'c-ok'};
}
const ORDER = {block:0, soon:1, hold:2, ok:3, none:4};

// ===== 데이터 =====
async function loadMe(){
  const uid = S.session.user.id;
  const [{data:adm}, {data:me}] = await Promise.all([
    sb.schema('public').rpc('is_admin'),
    sb.from('members').select('*').eq('user_id', uid).maybeSingle()
  ]);
  S.isAdmin = adm === true; S.me = me || null;
  if(me && me.active===false){ S.loginMsg='사용 중지된 계정입니다. 관리자에게 문의하세요.'; await sb.auth.signOut(); throw Object.assign(new Error('사용 중지된 계정입니다. 관리자에게 문의하세요.'), {inactive:true}); }
  if(S.isAdmin){ const {data} = await sb.from('members').select('*').order('display_name'); S.members = data || []; }
}
async function loadSummary(){
  const [{data, error}, {data:li}] = await Promise.all([sb.rpc('customer_summary', {p_base: S.base}), sb.rpc('last_inputs')]);
  if(error) throw error;
  const last = new Map((li||[]).map(r=>[r.customer_id, kstDate(r.last_input_at)]));
  S.summary = (data||[]).map(c=>({...c, last_input: last.get(c.customer_id)||null, _s: status(c)}))
    .sort((a,b)=> a.customer_name.localeCompare(b.customer_name,'ko') || (a.owner_name||'').localeCompare(b.owner_name||'','ko')); // 거래처 이름 가나다순
}

// 최근 입력: 앱에 마지막으로 거래를 등록한 날 (거래장 날짜가 아님). 30일 넘으면 주황색
const STALE_DAYS = 30;
const kstDate = ts => ts ? new Date(ts).toLocaleDateString('sv-SE', {timeZone:'Asia/Seoul'}) : null;
function lastInputHtml(c, long){
  if(!c.last_input) return '';
  const ago = dd(todayStr(), c.last_input); const old = ago > STALE_DAYS;
  const txt = `${long?c.last_input:md(c.last_input)} (${ago<=0?'오늘':ago+'일 전'})`;
  return long ? `<span style="${old?'color:#b54708;font-weight:700':''}">${txt}</span>`
              : `<span style="flex-basis:100%;${old?'color:#b54708':''}">최근 입력 <b style="${old?'color:#b54708':''}">${txt}</b></span>`;
}

// ===== 화면: 공통 헤더 =====
function header(title, back){
  const name = S.me ? esc(S.me.display_name) : '';
  return `<header class="top"><div class="in">
    ${back?`<button class="back" onclick="goBack()" aria-label="뒤로">‹</button>`:''}
    <h1>${esc(title)}</h1>
    <span class="who">${name} ${S.isAdmin?'<span class="badge b-admin">관리자</span>':''}</span>
    ${back?'':`<button class="btn ghost" onclick="logout()">로그아웃</button>`}
  </div></header>`;
}

// ===== 로그인 =====
function viewLogin(msg){
  app.innerHTML = `<div class="login">
    <h2>회전일 차트</h2><div class="muted">받은 아이디(또는 초대받은 이메일)로 로그인하세요.</div>
    <form id="lf" class="card">

// 정렬: 기본 이름순 / 회전일 긴 순 / 회전일 짧은 순 / 최근 입력 순 (미수금 없는 거래처는 회전일 정렬에서 맨 뒤)
function sortList(arr){
  const byName = (a,b)=> a.customer_name.localeCompare(b.customer_name,'ko') || (a.owner_name||'').localeCompare(b.owner_name||'','ko');
  const t = c => Number(c.balance)>0 && c.turnover_days!=null ? Number(c.turnover_days) : null;
  const mode = S.sort || 'name';
  if(mode==='name') return [...arr].sort(byName);
  if(mode==='inputNew') return [...arr].sort((a,b)=> (b.last_input||'').localeCompare(a.last_input||'') || byName(a,b)); // 최근에 입력한 거래처가 맨 위, 입력 없는 거래처는 맨 뒤
  return [...arr].sort((a,b)=>{ const x=t(a), y=t(b);
    if(x==null && y==null) return byName(a,b); if(x==null) return 1; if(y==null) return -1;
    return (mode==='turnDesc' ? y-x : x-y) || byName(a,b); });
}
// 거래처 하나를 회전일 기준 한 칸에 배정 (회사 열 구간과 같은 경계, 181일 이상 = 차단)
function bucketOf(c){
  if(!Number(c.balance)) return null;
  const t = c.turnover_days;
  if(t==null || (Number(c.undated_remaining)>0 && t < blockDays())) return 'undated_remaining';
  if(t >= blockDays()) return 'over_block';
  return t<=30?'d30': t<=60?'d60': t<=90?'d90': t<=120?'d120': t<=150?'d150':'d180';
}
function pickBucket(k){ S.bucket = (k && S.bucket!==k) ? k : null; viewDash(); }

function runCheck(entries){
  let rb=0; return entries.map(e=>{
    const counted = e.status==='확정';
    if(counted) rb += Number(e.sale_amount) - Number(e.pay_amount);
    const mism = counted && e.ledger_balance!=null && Number(e.ledger_balance)!==rb;
    return {...e, _rb: counted? rb : null, _mis: mism};
  });
}
function sortEntries(a,b){ if((a.kind==='이월')!==(b.kind==='이월')) return a.kind==='이월'?-1:1;
  if(a.entry_date!==b.entry_date){ if(!a.entry_date) return -1; if(!b.entry_date) return 1; return a.entry_date<b.entry_date?-1:1; }
  return Number(a.seq)-Number(b.seq); }

// 사진 축소 (긴 변 2400px, JPEG) → 업로드 용량·읽기 비용 절감
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>no(new Error('사진을 열 수 없습니다. (JPG/PNG로 다시 시도)')); i.src=url;});
    const k=Math.min(1, 2400/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.88));
  } finally { URL.revokeObjectURL(url); }
}
// 사진 → 서버에서 읽기 → 표의 줄로 변환
async function readPhotos(files, onStatus){
  const uid=S.session.user.id; const all=[]; let name='';
  for(let n=0;n<files.length;n++){
    onStatus(`${n+1}/${files.length}장 올리는 중...`);
    const blob=await shrink(files[n]);
    const path=`${uid}/${Date.now()}-${n}.jpg`;
    const up=await sb.storage.from('ledger-photos').upload(path, blob, {contentType:'image/jpeg'}); if(up.error) throw up.error;
    const ph=await sb.from('photos').insert({storage_path:path}).select('id').single(); if(ph.error) throw ph.error;
    S.photoIds.push(ph.data.id);
    onStatus(`${n+1}/${files.length}장 읽는 중... (10~30초)`);
    const {data, error}=await sb.functions.invoke('read-ledger',{body:{photo_id:ph.data.id}});
    if(error){ let m=error.message; try{ const b=await error.context.json(); m=b.message||m; }catch(_){} throw new Error(m); }
    if(!name && data.customer_name) name=data.customer_name;
    all.push(...data.rows.map(r=>({...r, _photo:n, _model:data.model})));
  }
  // 겹쳐 찍은 사진의 같은 줄(날짜·구분·금액 같고, 잔액이 있으면 잔액도 같음)은 중복 의심 → 기본 '저장 안 함'
  //  주문현황·수금현황처럼 잔액 칸이 없는 화면도 날짜·구분·금액으로 잡아냄 (같은 사진 안의 같은 줄은 중복으로 보지 않음)
  const firstPhoto = {};
  const rows = all.map(r=>{ const key=[r.date,r.kind,r.amount,r.balance??''].join('|');
    const dup = firstPhoto[key]!=null && firstPhoto[key]!==r._photo;
    if(firstPhoto[key]==null) firstPhoto[key]=r._photo;
    const flag = dup?'dup': r.unclear?'unc':'';
    return {date:r.date||null, kind:r.kind||'판매', amt:r.amount??null, item:r.item||'', lb:r.balance??null, flag, skip:!!flag}; });
  return {name, rows, models:[...new Set(all.map(r=>r._model))]};
}
const KIND_MAP = {'판매':'판매','매출':'판매','출고':'판매','수금':'수금','입금':'수금','이월':'이월','전기이월':'이월','전월이월':'이월','반품':'반품','할인':'매출할인','매출할인':'매출할인'};
function parseDate(s){ s=(s||'').trim(); if(!s) return null; const m=s.replace(/[./년월]/g,'-').replace(/일/,'').match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})/);
  if(!m) return undefined; let y=Number(m[1]); if(y<100) y+=2000; return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`; }
function num(s){ const v=String(s??'').replace(/[^0-9-]/g,''); return v===''||v==='-'?null:Number(v); }
// 엑셀에서 복사한 표(일자/구분/금액/품목/거래장잔액) → 표의 줄
function parsePaste(txt){
  return txt.split(/\r?\n/).map(l=>l.replace(/^[ ]+|[ ]+$/g,'')).filter(l=>l.replace(/\t/g,'').trim()).map(l=>{
    const c = l.includes('\t')? l.split('\t') : l.split(/,(?![0-9]{3})/);
    let kind=KIND_MAP[(c[1]||'').replace(/\s/g,'')]||'판매';
    const d=parseDate(c[0]); let amt=num(c[2]);
    if(amt!=null && amt<0){ if(kind==='판매') kind=/할인/.test(c[3]||'')?'매출할인':'반품'; amt=Math.abs(amt); } // 거래장의 마이너스 판매 = 반품
    return {date: d||null, kind, amt, item:(c[3]||'').trim(), lb:num(c[4]), flag: d===undefined?'date':'', skip:false};
  });
}
const isBlank = r => !r.amt && !r.item && r.lb==null;
const entryKey = (d,k,a)=> [d||'', k, Number(a)||0].join('|');

function markExisting(){

  const hasPrev = ex.size>0; // 이미 거래가 있는 거래처
  S.rows.forEach(r=>{ if(isBlank(r)) return;
    // 기존 거래처에 새 거래장을 올리면 맨 위 '전기이월'은 이미 반영된 잔액 → 기본 '저장 안 함' (처음 등록하는 거래처는 그대로 저장)
    if(r.kind==='이월' && hasPrev){ if(r.flag!=='carry'){ r.flag='carry'; r.skip=true; changed=true; } return; }
    if(r.flag==='carry'){ r.flag=''; r.skip=false; changed=true; }
    if(ex.has(entryKey(r.date, r.kind, r.amt))){ if(r.flag!=='exist'){ r.flag='exist'; r.skip=true; changed=true; } }
    else if(r.flag==='exist'){ r.flag=''; r.skip=false; changed=true; } });
  return changed;
}
function isCredit(k){ return k==='수금' || k==='반품' || k==='매출할인'; } // 가장 오래된 미수부터 차감
function rowError(r){
  if(r.skip) return '';
  if(r.flag==='date') return '날짜를 다시 골라주세요';
  if(!r.date && r.kind!=='이월') return '일자를 넣어주세요';
  if(r.amt==null) return '금액을 넣어주세요';
  if(r.amt===0 && r.kind!=='판매') return '금액을 넣어주세요'; // 0원은 판매(첨부·무상 품목)만 허용
  return '';
}
// 줄마다 계산 잔액·대조 결과 (저장 안 함·빈 줄 제외)
function evalRows(){
  let rb = S.startBal||0;
  return S.rows.map(r=>{
    if(isBlank(r)) return {state:'blank'};
    if(r.skip) return {state:'skip'};
    const err = rowError(r); if(err) return {state:'err', msg:err};
    rb += isCredit(r.kind) ? -r.amt : r.amt;
    if(r.amt===0 && (r.lb==null || r.lb===rb)) return {state:'ok', zero:true, rb, msg:`0원 품목 (첨부·무상) · 잔액 변동 없음${r.lb!=null?' ✓':''}`};
    if(r.lb==null) return {state:'ok', rb, msg:`계산 잔액 ${won(rb)}`};
    return r.lb===rb ? {state:'ok', rb, msg:`거래장 잔액과 일치 ✓`} : {state:'mis', rb, msg:`불일치 ⚠ 계산 ${won(rb)} / 거래장 ${won(r.lb)}`};
  });
}
function rowHtml(r,i){
  const fmt = v => v==null||v===''?'':Number(v).toLocaleString('ko-KR');
  return `<div class="mrow" data-i="${i}">
    <div class="mhead"><b>${i+1}</b>
      ${r.flag==='dup'||r.flag==='unc'||r.flag==='exist'||r.flag==='carry'?`<label class="mskip"><input type="checkbox" data-f="skip" ${r.skip?'checked':''}> 저장 안 함 <span class="muted">(${r.flag==='dup'?'앞 사진과 같은 줄':r.flag==='exist'?'이미 저장된 거래':r.flag==='carry'?'기존 거래처라 이월 제외':'사진 글자가 흐림'})</span></label>`:''}
      <span class="grow"></span><button type="button" class="mdel" data-del="${i}" aria-label="이 줄 삭제">🗑</button></div>
    <div class="mgrid">
      <label>일자<input class="i" type="date" data-f="date" value="${r.date||''}"></label>
      <label>구분<select class="i" data-f="kind">${['판매','수금','이월','반품','매출할인'].map(k=>`<option ${r.kind===k?'selected':''}>${k}</option>`).join('')}</select></label>
      <label>금액<input class="i" data-f="amt" inputmode="numeric" placeholder="0" value="${fmt(r.amt)}"></label>
      <label>거래장 잔액<input class="i" data-f="lb" inputmode="numeric" placeholder="선택" value="${fmt(r.lb)}"></label>
      <label class="span2">품목 / 적요<input class="i" data-f="item" placeholder="예: 하이알포르테주" value="${esc(r.item||'')}"></label>
    </div>
    <div class="mst" data-st></div>
  </div>`;
}
function paintStatus(){
  const ev = evalRows(); let save=0, bad=0, skip=0;
  document.querySelectorAll('#rows .mrow').forEach(el=>{
    const e = ev[+el.dataset.i]; const st = el.querySelector('[data-st]');
    el.classList.remove('ok','mis','err','skip','zero'); if(e.zero) el.classList.add('zero');
    if(e.state==='blank'){ st.textContent=''; return; }
    el.classList.add(e.state); st.textContent = e.state==='skip' ? '저장하지 않습니다' : e.msg;
    if(e.state==='ok') save++; else if(e.state==='mis'){ save++; bad++; } else if(e.state==='err') bad++; else skip++;
  });
  const name = (document.getElementById('pc')||{}).value?.trim();
  document.getElementById('msum').innerHTML = `저장할 줄 <b>${save}</b>${bad?` · <span style="color:var(--red)">확인 필요 ${bad}</span>`:''}${skip?` · 저장 안 함 ${skip}`:''}`
    + (ev.some(e=>e.state==='mis')?'<div class="muted">불일치 줄은 \'확인대기\'로 저장됩니다.</div>':'');
  document.getElementById('ps').disabled = !name || !save || ev.some(e=>e.state==='err');
}
function renderRows(){ document.getElementById('rows').innerHTML = S.rows.map(rowHtml).join(''); paintStatus(); }
async function loadStartBal(){
  const name=pc.value.trim(); const ex = findCust(name);
  S.startBal=0; S.startCust=ex?ex.customer_id:null; S.existKeys=new Set();
  if(ex){ const {data}=await sb.from('entries').select('*').eq('customer_id',ex.customer_id);
    (data||[]).forEach(e=>S.existKeys.add(entryKey(e.entry_date, e.kind, isCredit(e.kind)?e.pay_amount:e.sale_amount)));
    const r=runCheck((data||[]).sort(sortEntries)).reverse().find(x=>x._rb!=null); S.startBal=r?r._rb:0; }
  if(markExisting()) renderRows(); // 표시가 바뀐 줄이 있을 때만 다시 그림 (입력 중인 칸 보호)
  document.getElementById('mstart').textContent = ex ? custHint(ex, S.startBal) : (name?'새 거래처로 만들어집니다.':'');

}

  const name=`회전일차트_거래처요약_${who==='all'?'전체':label}_${S.base}.xlsx`;
  const blob=new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  // 휴대폰에서 공유(카톡 등)할 수 있으면 공유 창, 아니면 바로 다운로드
  const file = new File([blob], name, {type:blob.type});
  if(navigator.canShare && /Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('엑셀 파일을 받았습니다.');
}

async function openTeam(){ pushNav({v:'team'}); S.view='team'; await viewTeam(); }

// 헷갈리는 글자(0/o, 1/l/i) 뺀 임시 비밀번호 8자: 영문 4 + 숫자 4
function tempPw(){ const L='abcdefghjkmnpqrstuvwxyz', D='23456789'; const r=n=>{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; };
  let s=''; for(let i=0;i<4;i++) s+=L[r(L.length)]; for(let i=0;i<4;i++) s+=D[r(D.length)]; return s; }
function credText(c){ return `[회전일 차트]\n주소: ${APP_URL}\n아이디: ${c.id}\n임시 비밀번호: ${c.pw}\n처음 로그인하면 새 비밀번호를 정하는 화면이 나옵니다.`; }
function credBox(c){
  return `<div class="card" style="border:2px solid #9bd3ae;background:#f2fbf5"><h3>✅ ${esc(c.title)}</h3>
    <div class="muted">아래 내용을 복사해서 카톡 등으로 동료에게 보내세요. 이 화면을 벗어나면 임시 비밀번호는 다시 볼 수 없습니다.</div>
    <pre id="credTxt" style="white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;font-family:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;font-size:15px">${esc(credText(c))}</pre>
    <button class="btn" style="width:100%" onclick="copyCred()">복사하기</button></div>`;
}
async function copyCred(){ const t=document.getElementById('credTxt').textContent;
  try{ await navigator.clipboard.writeText(t); toast('복사했습니다.'); }
  catch(_){ const r=document.createRange(); r.selectNodeContents(document.getElementById('credTxt')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('글자가 선택되었습니다. 길게 눌러 복사하세요.'); } }
async function setActive(uid, on){
  const m = S.members.find(x=>x.user_id===uid); if(!m) return;
  if(!confirm(on ? `${m.display_name}님 계정을 다시 사용하게 할까요?` : `${m.display_name}님 계정을 사용 중지할까요?\n(바로 로그인·조회가 막힙니다. 거래처와 거래 내역은 그대로 남습니다)`)) return;
  const {error} = await sb.functions.invoke('manage-member', {body:{action: on?'enable':'disable', user_id:uid}});
  if(error){ let msg=error.message; try{ const b=await error.context.json(); msg=b.message||msg; }catch(_){} toast(msg); return; }
  await viewTeam(); toast(on ? `${m.display_name}님 계정을 다시 사용합니다.` : `${m.display_name}님 계정을 사용 중지했습니다.`);
}
async function resetPw(uid){
  const m = S.members.find(x=>x.user_id===uid); if(!m) return;
  if(!confirm(`${m.display_name}님의 비밀번호를 새 임시 비밀번호로 바꿀까요?\n(지금 쓰던 비밀번호로는 더 이상 로그인할 수 없습니다)`)) return;
  const pwv = tempPw();
  const {error} = await sb.functions.invoke('manage-member', {body:{action:'reset', user_id:uid, password:pwv}});
  if(error){ let msg=error.message; try{ const b=await error.context.json(); msg=b.message||msg; }catch(_){} toast(msg); return; }
  await viewTeam(null, true, {title:`${m.display_name}님 비밀번호를 초기화했습니다.`, id:shownId(m.login_id), pw:pwv});
  window.scrollTo(0,0);
}

// ===== 설명서 (관리자 전용) =====
// PDF는 암호화된 파일(guide.bin, admin.bin)로 앱과 함께 올라가 있고, 여는 열쇠는 관리자만 서버에서 받을 수 있음
const DOCS = {
  guide: {file:'guide.bin', name:'회전일 차트 사용 설명서.pdf', title:'회전일 차트 사용 설명서', desc:'동료(담당자)용. 시작하기·로그인·차트 보기·거래 입력·계산 기준·자주 묻는 질문', share:true},
  admin: {file:'admin.bin', name:'회전일 차트 관리자 설명서.pdf', title:'회전일 차트 관리자 설명서', desc:'관리자 본인용. 동료 초대·담당자 변경·설정·비용', share:false}
};
const DOC_VER = '20261102b';
const docCache = {};
async function loadDoc(k){
  if(docCache[k]) return docCache[k];
  const {data:keyB64, error} = await sb.schema('public').rpc('get_docs_key');
  if(error || !keyB64) throw new Error('관리자만 열 수 있습니다.');
  const res = await fetch(`${DOCS[k].file}?v=${DOC_VER}`); if(!res.ok) throw new Error('설명서 파일을 불러오지 못했습니다.');
  const buf = new Uint8Array(await res.arrayBuffer());
  const raw = Uint8Array.from(atob(keyB64), c=>c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pdf = await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, key, buf.slice(12));
  return (docCache[k] = new File([pdf], DOCS[k].name, {type:'application/pdf'}));
}
async function docAction(k, act){
  const w = act==='view' ? window.open('', '_blank') : null; // 팝업 차단 방지
  try{
    const f = await loadDoc(k); const url = URL.createObjectURL(f);
    if(act==='view'){ if(w) w.location.href=url; else location.href=url; }
    else if(act==='save'){ const a=document.createElement('a'); a.href=url; a.download=f.name; a.rel='noopener'; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(), 1000); }
    else if(act==='share'){
      if(navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f], title:DOCS[k].title});
      else { const a=document.createElement('a'); a.href=url; a.download=f.name; a.click(); toast('이 기기는 바로 공유가 안 돼서 파일로 받았습니다. 받은 파일을 카톡 등으로 보내세요.'); }
    }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ if(w) w.close(); if(e && e.name==='AbortError') return; toast(errMsg(e)); }
}
function openDocs(){
  if(!S.isAdmin){ go('dash'); return; }
  pushNav({v:'docs'}); S.view='docs';
  app.innerHTML = header('설명서', true) + `<div class="wrap">
    ${Object.entries(DOCS).map(([k,d])=>`<div class="card"><h3>📘 ${esc(d.title)}</h3><div class="muted">${esc(d.desc)}</div>
      <div class="row" style="margin-top:12px">
        <button class="btn sm sec" onclick="docAction('${k}','view')">보기</button>
        <button class="btn sm sec" onclick="docAction('${k}','save')">PDF 받기</button>
        ${d.share?`<button class="btn sm" onclick="docAction('${k}','share')">공유하기 (카톡·문자·메일)</button>`:'<span class="muted">동료에게 보내지 마세요</span>'}
      </div></div>`).join('')}
    <div class="muted">설명서는 관리자만 이 화면에서 볼 수 있습니다. 동료에게는 사용 설명서 PDF를 공유해 주세요.</div>
  </div>`;
}

// ===== 흐름 =====
async function refresh(rerender=true){
  try{ await loadSummary(); }catch(e){ toast(errMsg(e)); }
  if(!rerender) return;
  if(S.view==='detail') await viewDetail(); else if(S.view==='dash') viewDash();
}
// ===== 뒤로 가기 (아이폰 밀어서 뒤로·안드로이드 뒤로 버튼) =====
// 화면을 옮길 때마다 브라우저 기록을 남겨서, 뒤로 가기가 이전 화면으로 돌아오게 함
let NAV_POP = false;
function pushNav(st, replace){ if(NAV_POP) return; try{ history[replace?'replaceState':'pushState'](st, ''); }catch(_){} }
function goBack(){ if(history.state && history.state.v && history.state.v!=='dash') history.back(); else { S.view='dash'; refresh(true); } }
window.addEventListener('popstate', async e=>{
  if(!S.session || !S.me) return;
  const st = e.state || {v:'dash'}; NAV_POP = true;
  try{
    if(st.v==='detail') await openCust(st.id);
    else if(st.v==='entry') openEntry(st.keep);
    else if(st.v==='paste') openPaste(st.photo, st.keep);
    else if(st.v==='team') await openTeam();
    else if(st.v==='docs') openDocs();
    else { S.view='dash'; await refresh(true); }
  } finally { NAV_POP = false; }
});
// 화면 왼쪽 끝에서 오른쪽으로 밀면 뒤로 가기 (앱이 직접 처리)
//  - 홈 화면에 설치한 앱(아이폰·안드로이드): 브라우저의 밀기 뒤로 가기가 없음
//  - 안드로이드 브라우저: 버튼 3개 내비게이션이면 밀기 뒤로 가기가 없음
//  아이폰 사파리·크롬 탭은 자체 밀기 기능이 있어서 제외. 안드로이드 제스처 내비게이션은 시스템이 터치를 가져가므로(touchcancel) 두 번 뒤로 가지 않음
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const IS_STANDALONE = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
if(IS_STANDALONE || !IS_IOS){
  let sx=null, sy=0, moved=false;
  document.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx = t.clientX<36 ? t.clientX : null; sy=t.clientY; moved=false; }, {passive:true});
  document.addEventListener('touchmove', e=>{ if(sx!=null) moved=true; }, {passive:true});
  document.addEventListener('touchcancel', ()=>{ sx=null; }, {passive:true});
  document.addEventListener('touchend', e=>{ if(sx==null) return; const t=e.changedTouches[0];
    if(moved && t.clientX-sx>70 && Math.abs(t.clientY-sy)<70 && S.view!=='dash' && S.view!=='login') goBack(); sx=null; }, {passive:true});
}
function go(v){
  // 코드에서 첫 화면으로 돌아갈 때는 기록도 한 칸 뒤로 (뒤로 가기가 꼬이지 않게)
  if(v==='dash' && !NAV_POP && history.state && history.state.v && history.state.v!=='dash'){ history.back(); return; }
  S.view=v; if(v==='dash'){ refresh(true); }
}
async function logout(){ await sb.auth.signOut(); }
let START_ID = 0;
async function start(){
  const my = ++START_ID;               // 동시에 여러 번 불려도 마지막 것만 화면에 반영
  const stale = ()=> my !== START_ID;
  const {data:{session}} = await sb.auth.getSession(); if(stale()) return; S.session=session;
  if(!session){ S.view='login'; viewLogin(); return; }
  if(S.setPw){ viewSetPassword(); return; }
  if(session.user?.user_metadata?.must_change_pw){ viewSetPassword(true); return; } // 관리자가 만든·초기화한 계정의 첫 로그인
  app.innerHTML = `<div class="empty">불러오는 중...</div>`;
  // 10초 넘게 멈춰 있으면 다시 불러오기 버튼 표시 (빈 화면 방지)
  setTimeout(()=>{ if(!stale() && S.view!=='dash' && /불러오는 중/.test(app.textContent)){
    app.innerHTML = `<div class="empty">불러오는 데 시간이 오래 걸립니다.<br><br><button class="btn" onclick="location.reload()">다시 불러오기</button></div>`; } }, 10000);
  try{
    await loadMe(); if(stale()) return;
    if(!S.me){ viewName(); return; }
    if(S.ownerFilter==null) S.ownerFilter = S.isAdmin ? S.session.user.id : 'all';
    await loadSummary(); if(stale()) return;
    S.view='dash'; pushNav({v:'dash'}, true); viewDash();
  }catch(e){ if(stale()) return; if(e.inactive){ S.view='login'; return; } /* 로그인 화면은 SIGNED_OUT 처리에서 안내 문구와 함께 표시 */ app.innerHTML = header('회전일 차트') + `<div class="wrap"><div class="card err">${esc(errMsg(e))}</div><button class="btn" onclick="location.reload()">다시 불러오기</button></div>`; }
}
sb.auth.onAuthStateChange((ev, session)=>{
  // 주의: 이 콜백 안에서 Supabase를 바로 다시 부르면 로그인 처리와 서로 기다리며 멈출 수 있음 → 한 박자 뒤에 실행
  if(ev==='PASSWORD_RECOVERY') S.setPw = true;
  if(ev==='SIGNED_IN' && (!S.session || S.session.user.id!==session.user.id)){ S.session=session; setTimeout(start, 0); }
  if(ev==='SIGNED_OUT'){ S.session=null; S.me=null; S.isAdmin=false; S.summary=[]; S.ownerFilter=null; S.view='login'; setTimeout(()=>{ viewLogin(S.loginMsg); S.loginMsg=null; }, 0); }
});
start();
